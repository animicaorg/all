services:
  explorer2-api:
    build:
      context: ../..
      dockerfile: explorer2/docker/Dockerfile.api
    environment:
      EXPLORER2_PORT: 8081
      EXPLORER2_CORS_ORIGIN: "*"
      # Configure RPC URL for the API server
      # Default: http://host.docker.internal:8545/rpc (to reach RPC node on host)
      # Override: EXPLORER2_RPC_URL=http://your-rpc:8545/rpc docker compose up
      EXPLORER2_RPC_URL: ${EXPLORER2_RPC_URL:-http://host.docker.internal:8545/rpc}
    extra_hosts:
      # Allow containers to access host services via host.docker.internal
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  explorer2-web:
    build:
      context: ../..
      dockerfile: explorer2/docker/Dockerfile.web
    ports:
      - "3001:80"
    depends_on:
      explorer2-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost" ]
      interval: 10s
      timeout: 3s
      retries: 5
