[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animica-studio"
version = "0.1.0"
description = "Animica Studio – desktop application for the Animica blockchain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
package = [
    "pyinstaller>=6.0",
]

[project.scripts]
animica-studio = "animica_studio.app:main"

[tool.hatch.build.targets.wheel]
packages = ["animica_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
