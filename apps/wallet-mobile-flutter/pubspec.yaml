name: animica_wallet
description: Animica mobile wallet — view ANM balance, ANM-20 tokens and NFTs, buy ANM via buy.animica.org, and browse dapps with an injected provider.
publish_to: "none"
version: 0.2.4+10

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Routing + state
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1

  # Networking
  http: ^1.2.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # In-app dapp browser. flutter_inappwebview gives us JS injection so
  # we can expose `window.animica` to dapps just like the Chrome
  # extension. webview_flutter doesn't support synchronous JS↔Dart
  # bridges as cleanly.
  flutter_inappwebview: ^6.1.5

  # QR display + scan for Receive / Send
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Bech32m + hashing + canonical CBOR for tx envelopes
  bech32: ^0.2.2
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  cbor: ^6.2.0

  # JS runtime for the noble/post-quantum ML-DSA-65 bundle. There is no
  # pure-Dart FIPS 204 impl that's byte-compatible with the chain's
  # verifier; we ship the same noble TS the browser extension uses
  # (40 KB, IIFE bundle, MIT) and call it via QuickJS / JavaScriptCore.
  flutter_js: ^0.8.7

  # Open external URLs (e.g. buy.animica.org checkout)
  url_launcher: ^6.3.0

  # Inbound animica:// deep links (site pairing from animica.xyz)
  app_links: ^6.3.2

  # Clipboard, share, file picking (for wallets.json import/export)
  clipboard: ^0.1.3
  share_plus: ^10.0.2
  file_picker: ^8.0.0+1

  # Misc
  intl: ^0.20.2
  logging: ^1.2.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/js/
