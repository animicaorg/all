# Example nginx vhost for animica.org once the new Animica Chat is the
# homepage. NOT installed by the build — copy to
# /etc/nginx/sites-available/, symlink into sites-enabled/, then
# `nginx -t && systemctl reload nginx`.
#
# Layout:
#   /          + /chat/*   + /login + /signup + /pricing + /account
#   /billing   + /admin    + /tools             → animica-chat web (Vite SPA built
#                                                  to apps/animica-chat/web/dist/)
#   /api/*                                      → animica-chat server (Express :4400)
#
# Anything else (/developers, /wallet, /downloads, /docs, /network, /status, /about, …)
# continues to be served from the existing static Astro build at
# /var/www/animica.org/.

server {
    server_name animica.org www.animica.org;

    client_max_body_size 25m;
    access_log /var/log/nginx/animica.org.access.log;
    error_log  /var/log/nginx/animica.org.error.log;

    # Animica Chat API.
    location /api/ {
        proxy_pass         http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Animica Chat SPA routes. `try_files /index.html =404` returns the
    # built index for any path so client-side router handles it.
    location ~ ^/(chat|login|signup|account|billing|admin|tools|pricing)(/|$) {
        root /var/www/animica-chat/web;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Hashed assets emitted by Vite.
    location /assets/ {
        root /var/www/animica-chat/web;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # Root: serve the Animica Chat landing page (Vite build).
    location = / {
        root /var/www/animica-chat/web;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Everything else — fall through to the existing Astro marketing
    # site so internal nav links (/developers, /wallet, /downloads, …)
    # keep working unchanged.
    location / {
        root /var/www/animica.org;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/animica.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animica.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = animica.org)     { return 301 https://$host$request_uri; }
    if ($host = www.animica.org) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name animica.org www.animica.org;
    return 404;
}
