[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animica-miner-gui"
version = "9.0.8"
description = "Production-quality Qt desktop GUI miner for Animica blockchain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pydantic>=2.7.0",
    "matplotlib>=3.8.0",
    "httpx>=0.27.0",
    "jsonschema>=4.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]
gpu = [
    "pyopencl>=2024.1",
]

[project.scripts]
animica-miner-gui = "animica_miner_gui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["animica_miner_gui"]

[tool.hatch.build.targets.wheel.force-include]
"logo.png" = "animica_miner_gui/logo.png"
"animica_miner_gui/ide/toolchain/schemas/manifest.schema.json" = "animica_miner_gui/ide/toolchain/schemas/manifest.schema.json"
"animica_miner_gui/ide/toolchain/schemas/abi.schema.json" = "animica_miner_gui/ide/toolchain/schemas/abi.schema.json"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
