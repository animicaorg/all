# x402 rate limits (http{} context — limit_req_zone is not allowed in server{}).
#
# Sizing note (2026-08-15): the first burst of real ecosystem traffic — an
# uptime/trust monitor and an indexer sweeping all ten products — was answered
# 429 by a 2r/s burst=5 bucket. A monitor that measures reliability publishes
# that 429, so the limit was costing exactly the reputation the listing exists
# to build. Unpaid probes only render a 402 (no settlement, no chain write), and
# genuinely paid traffic is self-limiting: every settlement costs the payer
# $0.01 and the facilitator's daily gas budget caps the downside. So the bucket
# is now sized for a full product sweep plus headroom.
# 2026-08-19: raised 30r/s -> 300r/s. Burst-tested at 150 concurrent, the
# CATALOG endpoints were still answering 429 to between a quarter and a half of
# a monitor's sweep (/x402 38/150, /.well-known/x402 52/150, /x402.json 57/150,
# /x402/healthz 66/150). These are the machine-readable listing and the uptime
# probe — the exact surfaces x402-observer, AgentScore, mri-indexer and
# CarbonMonitor read to SCORE the endpoint. They serve cheap static JSON and
# never touch money, so throttling them protects nothing and is recorded as
# unreliability by the directories agents use to pick who to pay.
limit_req_zone $binary_remote_addr zone=x402_catalog:10m rate=300r/s;
limit_req_zone $x402_paid_key       zone=x402_paid:10m    rate=10r/s;
# 2026-08-15: 60r/m burst=3 was answering 429 to the discovery crawlers
# sweeping /x402/chain/* — 188 of one indexer's 237 requests. An UNPAID
# probe only renders a 402 (no chain read, no settlement), so the cheap
# thing was being rationed as if it were the expensive one. The expensive
# path is gated by money and by the facilitator's daily gas budget.
limit_req_zone $x402_paid_key       zone=x402_bulk:10m    rate=240r/m;

# ---------------------------------------------------------------------------
# 2026-08-19: SPLIT THE LIMIT BY WHETHER THE REQUEST ACTUALLY PAYS.
#
# Raising the ceiling twice did not fix this. Measured over 24h: 7,410 of
# 11,384 external x402 requests (65%) were answered 429 — and NONE of them
# carried a payment. They were scoring crawlers (AgentScore, mri-indexer,
# agent-tools.cloud, x402scan) sweeping every product, in bursts. A per-IP
# average of 0.04 r/s trips a 10r/s bucket easily when it arrives as fifty
# requests in one second.
#
# The cost of that is not lost sales — those clients never buy. It is that they
# RANK us. An endpoint that answers 429 to a reliability probe is recorded as
# unreliable by the very directories agents use to choose who to pay. That is
# the same failure the GEO audit product exists to detect, happening to us.
#
# An unpaid request renders a 402 challenge: no settlement, no chain write, no
# product execution. It is nearly free, and rationing it protects nothing. A
# request carrying a payment triggers real work and real money, and that is
# what the tight bucket is for.
#
# So the key is chosen per request: a paid request is counted ONLY in the paid
# zone, an unpaid one ONLY in the probe zone. nginx skips a limit whose key
# evaluates empty, which is what makes the two mutually exclusive.
#
# Covers both wire versions: v2 sends `payment-signature`, v1 sends `x-payment`.
map $http_payment_signature$http_x_payment $x402_paid_key {
    ""      "";                      # no payment header -> not counted here
    default $binary_remote_addr;
}
map $http_payment_signature$http_x_payment $x402_probe_key {
    ""      $binary_remote_addr;     # unpaid probe -> counted here
    default "";                      # paid -> not counted here
}

# Unpaid probes.
#
# 2026-08-19 (second sizing pass): 60r/s + burst=200 was STILL answering 429 to
# 7,479 of today's requests. Measured arrival, not guessed: the agent clients
# sweeping the catalog peak at **115 req/s** from a single IP (100.54.135.232
# sent 2,949 requests today; 54.208.68.8 1,411; both peaking at 115/s). At that
# rate burst=200 is drained in under four seconds and everything above 60/s is
# rejected for the rest of the sweep. The named reputation monitors were already
# clean by then — this is the anonymous "node" agent population, which is the
# one that might actually contain a buyer.
#
# 300r/s is ~2.6x the highest burst ever observed here, so a full-catalog sweep
# completes untouched, while a genuine flood still hits a wall. Safe because an
# unpaid request renders only a 402 challenge: no settlement, no chain write, no
# product execution. The money path is unchanged and stays tight (x402_paid
# 10r/s), gated additionally by the facilitator's daily gas budget.
limit_req_zone $x402_probe_key zone=x402_probe:10m rate=300r/s;

# ---------------------------------------------------------------------------
# PAID CRAWL decision endpoint (/x402/crawl/decide).
#
# Sized differently from everything above, because the client is not an agent
# shopping for a product — it is a CUSTOMER'S WEB SERVER asking about its own
# inbound traffic. One busy site behind this is legitimately hundreds of
# requests a second from a SINGLE IP, which is the exact shape every other
# bucket here exists to reject. Throttling it does not protect us: the endpoint
# is free, reads two local sqlite rows and settles nothing. It would instead
# make the customer's edge fail open and serve crawlers for free, which is the
# one outcome this product exists to prevent.
#
# 2000r/s per edge with a deep burst, and the gateway's own work per call is
# bounded. A genuine flood still hits a wall.
limit_req_zone $binary_remote_addr zone=x402_crawl_gate:10m rate=2000r/s;
