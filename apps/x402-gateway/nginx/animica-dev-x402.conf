    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
}

# ------------------------------------------------- everything else /x402/*
# The gateway answers 404 JSON with discovery pointers for unknown paths.
# NOTHING REAL MAY LAND HERE: every enabled product route (and every free
# product route) must be matched by one of the blocks above, because this
# one's 4k body cap and 30 s read timeout are below what a paid route needs
# — a 30 s cut-off would 504 a buyer whose settlement is still confirming,
# after the money moved. test/nginx-conf.test.js walks the registry against
# this file and fails if a route falls through to here.
location ^~ /x402/ {
    limit_req zone=x402_catalog burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8742;
    # The 402's payment-required header is a base64 PaymentRequired
    # object (~4.2 KB for qrng with discovery metadata). nginx must
    # hold the whole header block in one buffer; the 4k default
    # answers 502 'upstream sent too big header'.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
}
