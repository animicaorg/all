# animica-dev-x402.conf — https://animica.dev/x402/ location set for the
# PRODUCTION x402 gateway (src/server.js, 127.0.0.1:8742).
#
# REPO EXAMPLE FILE — nothing is installed by this file existing here.
# Deployment REPLACES the current simple `location ^~ /x402/` block in
# animica.dev.conf (which proxies the demo server on :4656) — read
# INSTALL.md in this directory first.
#
# This file is included INSIDE the animica.dev `server { }` block:
#     include /etc/nginx/snippets/animica-dev-x402.conf;
#
# REQUIRED http{}-context zones (nginx only allows `limit_req_zone` in the
# http{} context, so these two lines live in a conf.d file, e.g.
# /etc/nginx/conf.d/animica-x402-zones.conf — NOT in this snippet):
#
#     # x402 rate limits: one bucket per client IP (10m ≈ 160k IPs of state).
#     limit_req_zone $binary_remote_addr zone=x402_catalog:10m rate=5r/s;
#     limit_req_zone $binary_remote_addr zone=x402_paid:10m    rate=2r/s;
#     limit_req_zone $binary_remote_addr zone=x402_bulk:10m    rate=12r/m;
#
# Notes on the numbers:
#   * catalog: cheap + server-side cached 15 s — generous.
#   * paid:    every request is at most one chain settlement (~2-6 s on
#              Base); 2 r/s per IP is far above honest agent traffic.
#   * bulk:    each export can hold the Animica node loop ~0.5 s per chunk;
#              12/min per IP keeps the shared node healthy (the gateway also
#              serializes node reads internally — this is defense in depth).
#   * The facilitator (127.0.0.1:8743) is NEVER proxied. The gateway's
#     /metrics is loopback-only by construction (this set proxies /x402/*
#     paths only, and /x402/metrics is a 404 in the gateway).
#
# nginx inheritance gotcha: a location that sets any proxy_set_header
# inherits NONE from the server level, so every block below is fully
# self-contained on purpose.

# ---------------------------------------------------------- discovery (free)
location = /x402 {
    limit_req zone=x402_catalog burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8742;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 10s;
}

location = /.well-known/x402 {
    limit_req zone=x402_catalog burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8742;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 10s;
}

location = /x402/healthz {
    limit_req zone=x402_catalog burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8742;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 5s;
}

# ------------------------------------------------- qrng, $0.01 (GET + POST)
# Budget: readiness fetch (<=5 s) + settlement (<=75 s facilitator budget).
location = /x402/qrng/draw {
    limit_req zone=x402_paid burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8742;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
}

location = /x402/qrng {
    limit_req zone=x402_paid burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8742;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
}

# ------------------------------------- chain family (GET export + POST
# address-history $0.05 and balances $0.02). Budget: export exec (<=25 s) +
# settlement (<=75 s); responses up to 16 MB uncompressed (gzip'd by the
# gateway when the client accepts it) — leave proxy buffering ON so a slow
# client never holds the gateway.
#
# BODY SIZE: /x402/chain/balances takes up to 500 anim1… addresses ≈ 33 KB of
# JSON, so a 4k cap here would 413 a legitimate paid request before the
# gateway ever saw it. 160k leaves headroom over the gateway's own 128 KiB
# cap, which is the one that must do the rejecting (it answers a documented
# 400/413, not an nginx error page).
location ^~ /x402/chain/ {
    limit_req zone=x402_bulk burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 160k;
    proxy_pass http://127.0.0.1:8742;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 150s;
}

# --------------------- priority inference, $0.10 (POST, disabled by default)
# Budget: up to 2 x 180 s upstream attempts + 75 s settlement. NO response
# buffering here — settlement proof rides in headers today and SSE streaming
# may come later; buffering would break it.
location = /x402/v1/chat/completions {
    limit_req zone=x402_paid burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 300k;        # gateway enforces 256 KiB itself
    proxy_pass http://127.0.0.1:8742;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_read_timeout 480s;
    proxy_send_timeout 60s;
}

# ------------------------------------------ dev echo (production: 404s
# unless X402_ENABLE_ECHO=1 — the gateway enforces that; nginx just proxies)
location = /x402/paid/echo {
    limit_req zone=x402_paid burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8742;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
}

# ------------------------------------------------- everything else /x402/*
# The gateway answers 404 JSON with discovery pointers for unknown paths.
location ^~ /x402/ {
    limit_req zone=x402_catalog burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8742;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
}
