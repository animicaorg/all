# ==========================================================================
# PAID CRAWL — website owners charging AI crawlers for access.
#
# The operator side of this product is entirely FREE, so all of it sits on the
# cheap catalog/gate buckets rather than the money bucket. The only paid
# surface is a crawler buying a pass.
# ==========================================================================

# The decision endpoint. Called by a CUSTOMER'S EDGE once per inbound request,
# so it carries more traffic than every other route here combined and gets its
# own bucket (see animica-x402-zones.conf for the sizing argument). Timeouts
# are deliberately short: the caller's website is blocked on this answer, and a
# slow gate must degrade to fail-open at their edge rather than add latency to
# somebody else's page.
location = /x402/crawl/decide {
    limit_req zone=x402_crawl_gate burst=4000 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8742;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
}

