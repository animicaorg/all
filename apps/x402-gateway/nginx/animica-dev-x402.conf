    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
}

# --------------------------- randomness family, $0.01-$0.02 (POST /x402/random/*)
#   /int (16 KiB app cap) · /shuffle · /pick (X402_RANDOM_MAX_BODY_BYTES,
#   512,000 by default) · /commit (16 KiB)
#
# BODY SIZE: shuffle/pick advertise up to 10,000 items in the catalog, in
# every 402 schema and in the docs; a maximum-size shuffle body measures
# ~49 KB and the gateway accepts up to 512,000, so a small cap here would
# 413 legitimate paid requests before the gateway ever saw them and make the
# advertised cap unreachable. 600k sits above the app's cap so the APP does
# the rejecting, with structured JSON and a `caps` block.
#
# TIMEOUT: the facilitator settle budget alone is 75 s (src/middleware.js);
# a paid randomness request cut off at 30 s would 504 the buyer while the
# USDC settles — charged, no result. 120 s matches the other paid locations.
location ^~ /x402/random/ {
    limit_req zone=x402_paid burst=40 nodelay;
    limit_req zone=x402_probe burst=600 nodelay;   # unpaid 402 probes (see animica-x402-zones.conf)
    limit_req_status 429;
    client_max_body_size 600k;
    proxy_pass http://127.0.0.1:8742;
    # The 402's payment-required header is a base64 PaymentRequired
    # object (~4.2 KB for qrng with discovery metadata). nginx must
    # hold the whole header block in one buffer; the 4k default
    # answers 502 'upstream sent too big header'.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
}

# ------------------------------------- chain family (GET export + POST
# address-history $0.05 and balances $0.02). Budget: export exec (<=25 s) +
# settlement (<=75 s); responses up to 16 MB uncompressed (gzip'd by the
# gateway when the client accepts it) — leave proxy buffering ON so a slow
# client never holds the gateway.
#
# BODY SIZE: /x402/chain/balances takes up to 500 anim1… addresses ≈ 33 KB of
# JSON, so a 4k cap here would 413 a legitimate paid request before the
# gateway ever saw it. 160k leaves headroom over the gateway's own 128 KiB
# cap, which is the one that must do the rejecting (it answers a documented
# 400/413, not an nginx error page).
location ^~ /x402/chain/ {
    limit_req zone=x402_bulk burst=30 nodelay;
    limit_req zone=x402_probe burst=600 nodelay;   # unpaid 402 probes (see animica-x402-zones.conf)
    limit_req_status 429;
    client_max_body_size 160k;
    proxy_pass http://127.0.0.1:8742;
    # The 402's payment-required header is a base64 PaymentRequired
    # object (~4.2 KB for qrng with discovery metadata). nginx must
    # hold the whole header block in one buffer; the 4k default
    # answers 502 'upstream sent too big header'.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 150s;
}

# --------------------- priority inference, $0.10 (POST, disabled by default)
# Budget: up to 2 x 180 s upstream attempts + 75 s settlement. NO response
# buffering here — settlement proof rides in headers today and SSE streaming
# may come later; buffering would break it.
location = /x402/v1/chat/completions {
    limit_req zone=x402_paid burst=20 nodelay;
    limit_req zone=x402_probe burst=600 nodelay;   # unpaid 402 probes (see animica-x402-zones.conf)
    limit_req_status 429;
    client_max_body_size 300k;        # gateway enforces 256 KiB itself
    proxy_pass http://127.0.0.1:8742;
    # The 402's payment-required header is a base64 PaymentRequired
    # object (~4.2 KB for qrng with discovery metadata). nginx must
    # hold the whole header block in one buffer; the 4k default
    # answers 502 'upstream sent too big header'.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_read_timeout 480s;
    proxy_send_timeout 60s;
}

