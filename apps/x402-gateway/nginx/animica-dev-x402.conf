# The public terms document for one domain: /x402/crawl/{domain}. A PREFIX
# location, not a regex — the catch-all below is `^~`, which in nginx
# suppresses regex evaluation entirely, so a regex here would never be reached.
# The exact `=` blocks above still win over this for the real endpoints.
location ^~ /x402/crawl/ {
    limit_req zone=x402_catalog burst=600 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8742;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
}

location ^~ /x402/ {
    limit_req zone=x402_catalog burst=600 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8742;
    # The 402's payment-required header is a base64 PaymentRequired
    # object (~4.2 KB for qrng with discovery metadata). nginx must
    # hold the whole header block in one buffer; the 4k default
    # answers 502 'upstream sent too big header'.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
}
