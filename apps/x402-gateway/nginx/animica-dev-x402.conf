# ------------------------------- commit-reveal DISCLOSURE (free, no payment)
# Longest-prefix `^~` so it wins over the paid /x402/random/ block below.
# Read-only, tiny, and deliberately on the cheap catalog zone: an audit
# surface that costs nothing is the entire point of publishing a commitment.
location ^~ /x402/random/reveal/ {
    limit_req zone=x402_catalog burst=600 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8742;
    # The 402's payment-required header is a base64 PaymentRequired
    # object (~4.2 KB for qrng with discovery metadata). nginx must
