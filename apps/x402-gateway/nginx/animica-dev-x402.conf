    limit_req zone=x402_paid burst=20 nodelay;
    limit_req zone=x402_probe burst=600 nodelay;   # unpaid 402 probes (see animica-x402-zones.conf)
    limit_req_status 429;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8742;
    # The 402's payment-required header is a base64 PaymentRequired object
    # (several KB with discovery metadata). nginx must hold the whole header
    # block in one buffer; the 4k default answers 502 'upstream sent too big
    # header'.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
