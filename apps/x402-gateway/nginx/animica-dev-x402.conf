# The Paid Crawl protocol discovery document. Free, unauthenticated and the
# entry point for an AGENT acting on a website owner's behalf: every other
# discovery surface we publish lists things that cost money, so without this
# an agent could see three passes for sale and no way to find out how a site
# starts selling them.
location = /.well-known/paid-crawl {
    limit_req zone=x402_catalog burst=600 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8742;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
}

# Post-quantum crawl licences (ML-DSA-65). Issuing and verifying each spawn a
# bounded Python child that does real lattice cryptography — ~0.6s, and a body
# that carries a 3.3KB signature plus a 2KB public key. Hence the bulk bucket,
# the larger body cap, and a read timeout that exceeds the signer's own.
location = /x402/crawl/licence {
    limit_req zone=x402_bulk burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8742;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 45s;
}

location = /x402/crawl/licence/verify {
    limit_req zone=x402_bulk burst=20 nodelay;
