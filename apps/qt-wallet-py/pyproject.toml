[project]
name = "animica-qt-wallet"
version = "0.1.0"
description = "Animica Qt Wallet (Python)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Animica" }]
dependencies = [
  "aiohttp>=3.9",
  "cryptography>=42.0",
  "omni-sdk>=0.1.0",
  "PySide6>=6.6",
  "qasync>=0.27",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "pytest>=7.4.0",
  "ruff>=0.4.0",
]
qr = [
  "qrcode[pil]>=7.4.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
