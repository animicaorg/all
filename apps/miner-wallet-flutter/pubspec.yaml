name: animica_miner_wallet
description: Animica Miner-Wallet (Flutter) — Unified mining and wallet GUI with device management, real-time stats, and transaction handling.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & routing
  cupertino_icons: ^1.0.6
  go_router: ^14.2.0

  # State, utils, i18n
  flutter_riverpod: ^2.5.1
  intl: ^0.20.2
  collection: ^1.18.0
  logging: ^1.2.0

  # Networking
  http: ^1.2.1
  web_socket_channel: ^2.4.0

  # Storage & device
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  url_launcher: ^6.3.0
  universal_io: ^2.2.2
  file_picker: ^8.0.0+1
  share_plus: ^10.0.2

  # Crypto & codecs
  crypto: ^3.0.3
  hashlib: ^1.17.1

  # QR
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

  # Charts for stats
  fl_chart: ^0.68.0

  # System tray for desktop
  system_tray: ^2.0.3

  # Process management
  process_run: ^0.14.2

  # Env (optional for local dev)
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8

  # Optional helpers
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  # Bundle core assets
  assets:
    - assets/icons/app_icon.png
    - assets/icons/miner_icon.png
    - assets/images/hero.png

  # Inter font family
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
          weight: 400
        - asset: assets/fonts/InterVariable.ttf
          weight: 600
        - asset: assets/fonts/InterVariable-Italic.ttf
          style: italic

  # Enable built-in localization codegen
  generate: true

# Generate platform icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#0B0D12"
    theme_color: "#5EEAD4"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"

# Generate splash screen
flutter_native_splash:
  color: "#0B0D12"
  image: assets/images/hero.png
  android_12:
    color: "#0B0D12"
    image: assets/images/hero.png
