# Animica chain-stats API — nginx location blocks.
#
# Include this file INSIDE the `server { ... }` blocks (the HTTPS ones) of BOTH:
#   * animica.org           (/etc/nginx/sites-available/animica.org.conf or equivalent)
#   * explorer.animica.org  (/etc/nginx/sites-available/explorer.animica.org — NO .conf suffix)
#     WARNING: /etc/nginx/sites-available/explorer.animica.org.conf also exists but is a
#     DEAD duplicate nginx ignores (conflicting server_name) — editing it does nothing.
# e.g. add near the other location blocks:
#   include /root/animica/apps/chain-stats-api/deploy/nginx-locations.conf;
# then: nginx -t && systemctl reload nginx    (NOT done automatically)
#
# Notes:
# * `^~` prefix matching wins over any regex locations and over shorter
#   prefixes, so on explorer.animica.org these take precedence over the
#   generic `/api` proxy to the explorer2 vite/express stack. The explorer's
#   own /api/circulating-supply, /api/head, etc. are untouched (different
#   prefixes).
# * The service already sends Access-Control-Allow-Origin: * on every
#   response — do not add another add_header for it here (double headers).
# * /healthz is exposed as /healthz-stats publicly so it cannot collide with
#   the pool's /healthz or other services.

location ^~ /api/supply {
    proxy_pass http://127.0.0.1:8560;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;
}

