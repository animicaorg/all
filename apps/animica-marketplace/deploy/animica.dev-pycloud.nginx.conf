# SEO: the app emits these as Next route handlers enumerating every published public app and
# claimed developer handle, so they must reach the app rather than the static root.
location = /sitemap.xml {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /robots.txt {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
