# Animica Python Cloud — nginx location blocks for animica.dev.
#
# WHY THIS FILE EXISTS: animica.dev serves a STATIC homepage from /var/www/animica.dev via a
# `location /` catch-all, and proxies only an EXPLICIT allow-list of prefixes to the Next.js app
# on 127.0.0.1:4950. Any new top-level route without a block here is silently swallowed by the
# catch-all and serves the homepage with a 200 — which looks like a routing bug rather than a
# missing config. That trap has bitten /animal, /dev and /vpn historically (see the comments in
# animica.dev.conf). Every Python Cloud route therefore needs an entry below.
#
# Apply with deploy/apply-pycloud-nginx.sh (idempotent), then: nginx -t && systemctl reload nginx

# --- Python Cloud API ------------------------------------------------------------------------
# Executions can legitimately run to the platform maximum (CLOUD_MAX_TIMEOUT_MS, default 300s), so
# this block lifts the default proxy timeouts. It deliberately does NOT include the upgrade-banner
# sub_filter: these are JSON API responses and injecting a <script> into them would corrupt the body.
location ^~ /api/cloud/ {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8m;
    proxy_read_timeout 330s;
    proxy_send_timeout 330s;
    limit_req zone=anmcloud burst=20 nodelay;
}

# The public function-invocation endpoint. Separate, longer-prefix block so its rate-limit zone
# and timeouts are tuned independently of the control-plane API above: this is the path that
# untrusted internet traffic hits to run developer code, so it gets the tighter budget.
location ^~ /api/cloud/v1/fn/ {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 330s;
    proxy_send_timeout 330s;
    limit_req zone=anminvoke burst=10 nodelay;
}

# --- Python Cloud pages ----------------------------------------------------------------------
# HTML routes get the upgrade-banner include, matching every other proxied HTML surface.
location ^~ /apps {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/anm-upgrade-inject-proxy.conf;
}

