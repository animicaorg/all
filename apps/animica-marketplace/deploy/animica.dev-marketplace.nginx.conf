# Animica AI Marketplace — nginx location blocks for animica.dev
# ---------------------------------------------------------------------------
# APPLY: paste these blocks into /etc/nginx/sites-available/animica.dev.conf
# INSIDE the `server { ... }` that listens on 443, immediately AFTER the
# `location ~* \.(js|css|...)$ { ... }` regex asset block, then:
#     nginx -t && systemctl reload nginx
# A backup of the pre-marketplace config is at:
#     /root/site-backups/animica.dev.conf.pre-marketplace.YYYYMMDD
#
# Why ^~ : the existing regex asset location outranks plain prefix locations, so
# /marketplace/_next/*.js would 404 from disk. ^~ prefixes win over the regex.
# The HTML locations include the banner PROXY snippet (sets Accept-Encoding "" so
# the upgrade-banner sub_filter still matches the proxied Next.js responses).
# ---------------------------------------------------------------------------

location ^~ /_next/ {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1h;
}

# Internal-only endpoints: Bearer-gated AND intended solely for local daemons (the mascot posting
# engine, the newsletter sender) that call them on 127.0.0.1:4950 directly. Deny them at the public
# edge — a longer ^~ prefix / exact `=` match outranks the general /api/mkt/ block below. The Animal
# internal routes return UNSEALED social tokens, so this deny is a hard isolation boundary, not a
# nicety. apply-nginx.sh asserts these lines are present after applying.
location ^~ /api/mkt/v1/animal/internal/ { return 404; }
location = /api/mkt/v1/newsletter/confirmed { return 404; }

# Developer API — open to humans AND autonomous agents (JSON; no banner).
location ^~ /api/mkt/ {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    client_max_body_size 24m;
}

location ^~ /embed/ {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /marketplace {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/anm-upgrade-inject-proxy.conf;
}

location ^~ /studio {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/anm-upgrade-inject-proxy.conf;
}

