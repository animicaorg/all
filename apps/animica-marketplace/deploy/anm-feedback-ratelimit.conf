# The site feedback form is unauthenticated and causes an email to be sent to the
# owner's own inbox, so it is an abuse vector pointed at the operator. The route
# carries its own in-process limiter, but that resets on every redeploy and is
# per-instance — this is the real ceiling, and it lives in front of Node so a flood
# never reaches the app or the SMTP session at all.
#
# 6r/m with a burst of 3: a person writing genuine feedback sends one message and
# occasionally a second; nothing legitimate needs more.
limit_req_zone $binary_remote_addr zone=anmfeedback:10m rate=6r/m;
