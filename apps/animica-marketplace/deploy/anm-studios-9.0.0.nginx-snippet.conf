# 9.0.0 GPU Studios — paste these location blocks into
# /etc/nginx/sites-available/animica.dev.conf ABOVE the `location ^~ /api/mkt/` block
# (nginx picks the longest ^~ prefix, but keeping them adjacent documents intent).
# The generic /api/mkt/ block keeps its 24m cap — only these three need big bodies.

# Large binary input uploads (video ≤512m, .blend ≤512m, audio ≤200m; app re-enforces
# per-purpose caps while streaming). Request buffering OFF so a 500MB upload streams to
# the app instead of spooling to an nginx temp file first.
location ^~ /api/mkt/v1/media/uploads {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512m;
    proxy_request_buffering off;
    # This location also serves the miner's GET of the input file — stream it out
    # instead of spooling ≤512MB through proxy_temp.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Miner streams a finished artifact (upscaled video / frame zip) — up to 1g.
location ^~ /api/mkt/v1/media/miner/result-file {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1g;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# Artifact downloads — response buffering OFF so big files stream straight through.
location ^~ /api/mkt/v1/media/artifacts/ {
    proxy_pass http://127.0.0.1:4950;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
}
