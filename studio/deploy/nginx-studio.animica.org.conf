# =============================================================================
# studio.animica.org — static landing site for Animica Studio
#
# This vhost serves the static marketing/landing site from studio/web and
# proxies API traffic to the node JSON-RPC and the AI-compute broker.
#
# IMPORTANT — the hosted terminal is GONE:
#   The previous studio.animica.org proxied a per-user noVNC desktop / shell
#   session served by the studio-host broker at 127.0.0.1:8123 (an
#   authenticated, shell-capable agent on the public internet). That is being
#   REMOVED. There is intentionally NO proxy to 127.0.0.1:8123 anywhere in this
#   file — no noVNC, no terminal, no shell embed. Studio is now SDK + RPC only.
#
# Deploy: see studio/deploy/CUTOVER.md
# Path:   /etc/nginx/sites-available/studio.animica.org.conf
# =============================================================================

# gzip is usually enabled globally in nginx.conf; these directives are safe to
# repeat at server scope and make this vhost self-contained.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    application/manifest+json;

# ---- HTTP :80 — redirect to HTTPS (certbot also manages this; harmless) ----
server {
    listen 80;
    listen [::]:80;
    server_name studio.animica.org;

    # Allow ACME http-01 challenges to pass through if certbot uses webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 — the studio static site ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.animica.org;

    # --- TLS (managed by certbot; paths shown for completeness) ---
    ssl_certificate     /etc/letsencrypt/live/studio.animica.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.animica.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Static document root: the Animica Studio landing site ---
    root /root/animica/studio/web;
    index index.html;

    # --- Security headers ---
    add_header X-Frame-Options              "SAMEORIGIN"            always;
    add_header X-Content-Type-Options       "nosniff"               always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection             "1; mode=block"         always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
    # The page is fully self-contained (inline CSS, no external scripts), so a
    # tight CSP is safe. 'unsafe-inline' covers the inline <style> + JSON-LD.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://rpc.animica.org https://pool.animica.org; base-uri 'self'; frame-ancestors 'self'" always;

    client_max_body_size 4m;

    # llms.txt is plain text and should be cheaply discoverable by agents/crawlers.
    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    # --- JSON-RPC: proxy /rpc -> local node (state.* / chain.* / miner.* / aicf.*) ---
    location /rpc {
        proxy_pass http://127.0.0.1:8545;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # JSON-RPC is request/response — no upgrade/streaming needed here.
    }

    # --- AI compute broker: proxy /v1 -> pool/broker (OpenAI-compatible API) ---
    # The broker listens locally on 127.0.0.1:8787 (animica-pool-api). Adjust the
    # upstream port to match the deployed broker if it differs.
    location /v1 {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # inference can be slow on CPU workers
        proxy_send_timeout 600s;
        proxy_buffering off;       # stream tokens back to the client
    }

    # =========================================================================
    # NOTE: there is deliberately NO `location /` (or any other location) that
    # proxies to http://127.0.0.1:8123. The noVNC / hosted-terminal broker
    # (studio-host) has been REMOVED from studio.animica.org. Do not re-add it.
    # =========================================================================

    # --- Static file serving with sane caching for hashed/long-lived assets ---
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- SPA-free static fallback: serve the file, else the landing page ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
