[project]
name = "{{slug}}"
version = "0.1.0"
description = "{{name}} — a starter Python CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
{{slug}} = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]
