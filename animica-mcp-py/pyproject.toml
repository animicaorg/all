[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animica-mcp"
version = "0.1.0"
description = "Animica MCP server — cheap OpenAI-compatible AI inference, code generation, embeddings & agent tools for bots and agents. Also lets compute owners earn ANM by powering the network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Animica", email = "dev@animica.org" }]
keywords = ["mcp", "model-context-protocol", "ai", "llm", "openai", "inference", "embeddings", "agents", "code-generation", "crypto", "mining"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=1.2.0", "httpx>=0.27"]

[project.scripts]
animica-mcp = "animica_mcp.server:main"

[project.urls]
Homepage = "https://animica.org/developers"
Repository = "https://github.com/animicaorg/all"
"API Keys" = "https://pool.animica.org"

[tool.hatch.build.targets.wheel]
packages = ["src/animica_mcp"]
