name: CLI import smoke

# Catches the class of breakage where a module is imported by the CLI but never
# `git add`ed. That is invisible to the release process: the wheel is built from the
# WORKING TREE, so an untracked file still ships to PyPI correctly while every clone of
# this repo gets an ImportError on the first `animica` command. It happened with
# animica/cli/cloud.py plus the whole animica/cloud/ and animica/cloud_worker/ packages,
# and `python -m animica --help` was broken from source for every commit in between.
#
# The check works because a CI checkout contains ONLY tracked files. Installing from
# that tree and running the CLI reproduces exactly what a contributor sees.

on:
  push:
    paths:
      - "python/**"
      - ".github/workflows/cli-import-smoke.yml"
  pull_request:
    paths:
      - "python/**"
  workflow_dispatch:

jobs:
  cli-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from the checked-out tree
        run: |
          python -m pip install --upgrade pip
          # No -e: install exactly what the tracked tree produces.
          pip install ./python

      - name: animica --help must work
        run: |
          animica --version
          animica --help

      - name: Every CLI subcommand module must import
        # main.py imports ~37 submodules in one `from . import (...)`, so a single
        # missing file breaks all of them. Import each individually to name the
        # culprit instead of failing on the whole tuple.
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import animica.cli as cli

          failed = []
          for m in pkgutil.iter_modules(cli.__path__):
              name = f"animica.cli.{m.name}"
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failed.append((name, f"{type(exc).__name__}: {exc}"))

          for name, err in failed:
              print(f"FAIL {name}: {err}", file=sys.stderr)
          if failed:
              sys.exit(f"{len(failed)} CLI module(s) failed to import")
          print("all animica.cli submodules import cleanly")
          PY

      - name: Subcommand help must render
        # A module can import and still be unusable if its Typer app is malformed.
        run: |
          for c in cloud wallet chain mining node tx chat up; do
            echo "--- animica $c --help"
            animica "$c" --help > /dev/null || exit 1
          done
          echo "subcommand help OK"
