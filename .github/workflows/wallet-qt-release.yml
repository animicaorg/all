name: Wallet Qt Release

# Cross-platform RELEASE build for the Qt desktop wallet. Unlike
# wallet-qt-build.yml (a compile-only smoke test), this produces installable,
# uploadable artifacts on native runners and bundles the animica CLI from the
# repo's python/ tree (so the wallet ships the current release, e.g. 5.2.6).
#
# Runners:
#   - ubuntu-22.04  → linuxdeployqt requires glibc <= 2.35 (Ubuntu 22.04); newer
#                     hosts are refused, which is exactly why this can't be built
#                     on the production box. The 22.04 runner satisfies it.
#   - macos-latest  → native .app (ad-hoc signed; Developer ID / notarization
#                     needs Apple creds, out of scope here).
#   - windows-latest → native installer via Inno Setup.
#
# Deploying the resulting artifacts to animica.org/wallet is a SEPARATE, manual
# step (wallet-qt/scripts/publish-wallet-downloads.sh) — this workflow only
# builds + uploads.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build/release label (e.g. v0.2.5). The wallet bundles animica from python/ (5.2.6)."
        required: true
        default: "v0.2.5"
      create_release:
        description: "Also attach artifacts to a GitHub Release"
        type: boolean
        default: false
  push:
    tags:
      - 'wallet-v*'

jobs:
  build:
    name: build-${{ matrix.platform }}
    permissions:
      contents: write   # needed only when create_release / tag attaches artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            qt: '6.5.0'          # nearly-working here; only needs libxcb-cursor0
          - os: macos-latest     # arm64, no queue; 6.7 dropped the AGL.framework ref
            platform: macos
            qt: '6.7.3'
          - os: windows-2022     # release-windows.ps1 uses the "Visual Studio 17 2022" generator
            platform: windows
            qt: '6.7.3'          # post-6.5 windeployqt deploy-script fixes
    runs-on: ${{ matrix.os }}
    env:
      WALLET_VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release scripts derive a version from git describe

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: 'qtnetworkauth'
          cache: true

      - name: Set up Python 3.12 (bundled animica node)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Host build helpers (icon generation needs Pillow)
        shell: bash
        # scripts/gen-icons.py is invoked as `python3` by release-{linux,mac}.sh,
        # so Pillow must land in that interpreter (setup-python provides it);
        # fall back to `python` on runners where `python3` is absent (Windows).
        run: python3 -m pip install --upgrade pip Pillow || python -m pip install --upgrade pip Pillow

      # ----------------------------- Linux -----------------------------
      - name: System dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libssl-dev \
            libgl1-mesa-dev fuse libfuse2 file desktop-file-utils \
            libxcb-cursor0 libxcb-cursor-dev libxcb-xinerama0 libxkbcommon-x11-0
          curl -fsSL -o /usr/local/bin/linuxdeployqt \
            https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x /usr/local/bin/linuxdeployqt

      - name: Build + package (Linux)
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # Building one platform in CI must NOT run the cross-platform website
          # publish step (it validates a Windows checksum that isn't present here).
          WALLET_SKIP_WEBSITE_PUBLISH: '1'
        run: |
          cd wallet-qt
          ./scripts/release-linux.sh

      # ----------------------------- macOS -----------------------------
      - name: System dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install cmake ninja openssl@3 create-dmg || true

      - name: Provide AGL.framework stub (macOS)
        if: matrix.platform == 'macos'
        # Qt's OpenGL wrap still emits `-framework AGL`, but AGL was removed from
        # recent macOS SDKs (the runner's default Xcode varies, hence the flaky
        # "framework 'AGL' not found"). AGL is unused and -dead_strip_dylibs drops
        # it from the final binary, so an empty stub in the active SDK satisfies ld.
        run: |
          set -euo pipefail
          STUB="$RUNNER_TEMP/agl-stub/AGL.framework/Versions/A"
          mkdir -p "$STUB"
          printf 'void _animica_agl_stub(void){}\n' > "$RUNNER_TEMP/agl_stub.c"
          clang -dynamiclib -o "$STUB/AGL" \
            -install_name /System/Library/Frameworks/AGL.framework/Versions/A/AGL \
            "$RUNNER_TEMP/agl_stub.c"
          ln -sf Versions/A/AGL "$RUNNER_TEMP/agl-stub/AGL.framework/AGL"
          SDK="$(xcrun --show-sdk-path)"
          echo "Injecting AGL stub into active SDK: $SDK"
          sudo cp -R "$RUNNER_TEMP/agl-stub/AGL.framework" "$SDK/System/Library/Frameworks/"
          ls -la "$SDK/System/Library/Frameworks/AGL.framework"

      - name: Build + package (macOS)
        if: matrix.platform == 'macos'
        env:
          WALLET_SKIP_WEBSITE_PUBLISH: '1'   # CI must not run the cross-platform website publish
        run: |
          cd wallet-qt
          ./scripts/release-mac.sh --dmg --adhoc-sign

      # ---------------------------- Windows ----------------------------
      - name: Set up MSVC dev environment (Windows)
        if: matrix.platform == 'windows'
        # build-windows.ps1 configures with -G "Visual Studio 17 2022"; this makes
        # the VS 2022 toolchain discoverable to cmake on the runner.
        uses: ilammy/msvc-dev-cmd@v1

      - name: System dependencies (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y --no-progress

      - name: Build + package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd wallet-qt
          ./scripts/release-windows.ps1

      # --------------------------- Collect -----------------------------
      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p out
          find dist/wallet-qt wallet-qt/build -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' \
               -o -name '*.dmg' -o -name '*.zip' -o -name '*Setup*.exe' \
               -o -name 'SHA256SUMS' \) -exec cp -v {} out/ \; 2>/dev/null || true
          echo "--- collected ---"; ls -la out || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-${{ matrix.platform }}-${{ env.WALLET_VERSION }}
          path: out/**
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.WALLET_VERSION }}
          files: out/**
          fail_on_unmatched_files: false
