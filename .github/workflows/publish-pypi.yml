name: Publish animica to PyPI (Trusted Publishing)

# Publishes the `animica` package to PyPI via PyPI Trusted Publishing (OIDC) —
# no API token stored in the repo. One-time PyPI setup: project animica ->
# Settings -> Publishing -> add a GitHub Actions trusted publisher with
# owner=animicaorg, repo=all, workflow=publish-pypi.yml, environment=pypi.
#
# Trigger: pushing a tag like v5.0.4 (or a published GitHub Release).
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build + run release gate
        run: |
          python -m pip install --upgrade build pyflakes
          # Tag vX.Y.Z must match python/pyproject.toml version
          ver=$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$tag" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME != version $ver"; exit 1
          fi
          ( cd python && python -m build )
          ANIMICA_PY=python bash scripts/release_gate.sh "$(ls python/dist/animica-*.whl)"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: python/dist/* }

  pypi-publish:
    needs: release-gate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # OIDC for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade build && cd python && python -m build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
