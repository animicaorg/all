      coinbase_default: "anim1tcoinbasexxxxxxxxxxxxxxxxxxxxxxxxxxx"
    aicf:
      # Phase 1: Block-based credit distribution
      epoch_length_blocks: 100
      block_reward_slice_bps: 500
      fee_slice_bps: 2000
      ena_call_fee_base_nano: 10000
      ena_call_fee_aicf_bps: 8000
      epoch_payout_bps: 5000
      credits_per_block: 1000000
      max_claim_epochs: 100
      prune_after_epochs: 10000
      
      # Phase 2: GPU Contributor Program & Useful Work Receipts
      phase2:
        maturity_depth_blocks: 10                  # Lower for testnet (faster testing)
        reserve_ratio_bps: 500                     # 5% reserve (lower for testing)
        payout_mode: "pull"
        min_claim_amount: 100000                   # Lower threshold for testing
        max_claims_per_epoch: 1000
        registration_mode: "bond"
        min_provider_bond: 50000000                # 0.05 ANM (lower for testnet)
        provider_heartbeat_timeout_blocks: 500
        receipt_min_fee: 1000                      # Lower for testing
        receipt_per_block_cap: 100
        receipt_per_epoch_cap: 10000
        training_credit_multiplier_bps: 10000
        training_receipt_min_gpu_hours: 0.01       # Lower for testing
        training_receipt_max_credit: 10000000000
    monetary:
      premine:
        total_anm: 1250000.0
        allocations:
          - address: "anim1ttreasuryxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
            amount_anm: 1000000.0
            vesting: { cliff_days: 0, linear_months: 0 }
          - address: "anim1taicfxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
            amount_anm: 250000.0
            vesting: { cliff_days: 0, linear_months: 0 }
      issuance:
        target_block_interval_ms: 300000
        min_block_spacing_ms: 60000              # 60 seconds (1 minute minimum)
        max_block_time_s: 3600                   # 3600 seconds (1 hour maximum)
        subsidy:
          start_nANM_per_block: 5000000000    # 5 ANM per block base reward
          epoch_length_blocks: 1350000         # 1.35M blocks per halving epoch
          decay_pct_per_epoch: 50.0            # 50% decay per epoch (true halving)
          tail_nANM_per_block: 100000          # 0.0001 ANM tail (never below this)
          max_halvings: 64
        subsidy_split_pct: { miner: 100, aicf: 0, treasury: 0 }
      fees:
        base_fee: { burn_pct: 10, treasury_pct: 45, aicf_pct: 45 }
        tips_split_pct: { miner: 80, aicf: 20 }
    consensus:
      poies:
        theta_initial_munats: 18000000
        theta_min_munats: 9000000
        theta_max_munats: 3000000000           # Hard cap at 3B µ-nats (3,000 nats) for network stability
        retarget: { window_blocks: 900, ema_beta: 0.25, clamp_ratio_per_window: { min: 0.5, max: 2.0 } }
        share_target_munats: 3000000
        nullifier_ttl_blocks: 32768
        gamma: { total_cap_munats: 10000000, escort_quantile: 0.2 }
      fairness_alpha:
        epoch_blocks: 216000
        step_per_epoch: 0.005
        bounds: { min: 0.33, max: 2.0 }
    blocks:
      version: 1
      max_bytes: 3000000
      max_gas: 60000000
      max_txs: 40000
      max_proofs: { hashshare: 32768, ai: 1024, quantum: 512, storage: 8192, vdf: 1 }
      receipts_inclusion: true
    data_availability:
      blob_max_bytes_per_block: 67108864       # 64 MiB
      erasure: { k: 12, n: 24, shard_bytes: 1024 }
      nmt: { namespace_bits: 32 }
      das: { target_failure_prob: "1e-8", min_samples: 20, max_samples: 120 }
    vm:
      gas_table_file: "spec/opcodes_vm_py.yaml"
      base_tx_gas: 3000
      max_code_bytes: 262144
      max_stack_depth: 2048
    randomness:
      round_seconds: 60
      reveal_grace_seconds: 20
      vdf: { iterations: 500000, modulus_bits: 2048 }
    p2p:
      default_ports: { tcp: 37200, quic: 37201, ws: 37202 }
      max_peers: 96
      gossip_target_degree: 10

