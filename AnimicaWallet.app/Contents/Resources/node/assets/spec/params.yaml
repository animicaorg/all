# Animica canonical chain/economic/consensus parameters
# Units: unless otherwise noted, currency units are in nANM (nano-ANM = 10^-9 ANM).

spec_version: "0.1.0"
last_updated: "2025-09-19"

# Pointers to other normative spec files (used by tooling to cross-check hashes/paths)
references:
  poies_policy: "spec/poies_policy.yaml"
  pq_policy: "spec/pq_policy.yaml"
  chains: "spec/chains.json"
  domains: "spec/domains.yaml"
  tx_cddl: "spec/tx_format.cddl"
  header_cddl: "spec/header_format.cddl"
  blob_cddl: "spec/blob_format.cddl"
  abi_schema: "spec/abi.schema.json"
  manifest_schema: "spec/manifest.schema.json"
  vm_opcodes_gas: "spec/opcodes_vm_py.yaml"
  openrpc: "spec/openrpc.json"

################################################################################
# NETWORKS
################################################################################
networks:
  # ----------------------------- MAINNET --------------------------------------
  "animica:1":
    name: "Animica Mainnet"
    symbol: "ANM"
    decimals: 9                # 1 ANM = 1_000_000_000 nANM
    genesis_time_utc: "2026-01-27T00:00:00Z"
    # Addresses below are placeholders; final values are set at genesis build
    system_addresses:
      treasury: "anim1treasuryxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      aicf_treasury: "anim1aicfxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      foundation_lockup: "anim1foundationxxxxxxxxxxxxxxxxxxxxxxxxxx"
      coinbase_default: "anim1coinbasexxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    aicf:
      # Phase 1: Block-based credit distribution
      epoch_length_blocks: 100                    # Blocks per epoch for credit distribution
      block_reward_slice_bps: 500                  # 5% of block reward to AICF pool
      fee_slice_bps: 2000                          # 20% of tx fees to AICF pool
      ena_call_fee_base_nano: 10000                # 0.00001 ANM base fee per ENA call
      ena_call_fee_aicf_bps: 8000                  # 80% of ENA call fee to AICF (20% to miner)
      epoch_payout_bps: 5000                       # 50% of epoch inflows become distributable
      credits_per_block: 1000000                   # Fixed credits awarded per mined block
      max_claim_epochs: 100                        # Max epochs claimable in a single tx
      prune_after_epochs: 10000                    # Epochs to keep before pruning (future work)
      
      # Phase 2: GPU Contributor Program & Useful Work Receipts
      phase2:
        # Maturity & Epoch Configuration
        maturity_depth_blocks: 50                  # Confirmations before receipt counts (reorg safety)
        reserve_ratio_bps: 1000                    # 10% of pool held in reserve
        payout_mode: "pull"                        # "pull" (providers claim) or "push" (auto-payout)
        min_claim_amount: 1000000                  # 0.000001 ANM minimum claim
        max_claims_per_epoch: 1000                 # DoS prevention: max claims per epoch
        
        # Provider Registration
        registration_mode: "bond"                  # "bond" (permissionless + stake) or "allowlist" (governance)
        min_provider_bond: 500000000               # 0.5 ANM minimum bond (if bond mode)
        provider_heartbeat_timeout_blocks: 1000    # Mark provider inactive after N blocks without heartbeat
        
        # Receipt Anti-Spam
        receipt_min_fee: 10000                     # 0.00001 ANM minimum fee per receipt
        receipt_per_block_cap: 100                 # Max receipts per block (consensus DoS prevention)
        receipt_per_epoch_cap: 10000               # Max receipts per epoch per provider
        
        # Training Receipts (Mining → AI Link)
        training_credit_multiplier_bps: 10000      # 100% bonus (miners earn 1:1 with cost paid)
        training_receipt_min_gpu_hours: 0.1        # Minimum GPU hours for valid training receipt
        training_receipt_max_credit: 100000000000  # 100 ANM max credit per training receipt
    monetary:
      premine:
        total_anm: 81000000.0   # ANM (human units)
        allocations:
          - address: "anim1foundationxxxxxxxxxxxxxxxxxxxxxxxxxx"
            amount_anm: 45000000.0
            vesting:
              cliff_days: 365
              linear_months: 36
          - address: "anim1treasuryxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
            amount_anm: 20000000.0
            vesting: { cliff_days: 0, linear_months: 0 }
          - address: "anim1aicfxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
            amount_anm: 7000000.0
            vesting: { cliff_days: 0, linear_months: 0 }
          - address: "anim1founderxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
            amount_anm: 9000000.0
            vesting: { cliff_days: 0, linear_months: 0 }
      issuance:
        # Target block time (consensus retarget aims to meet this)
        target_block_interval_ms: 300000
        # Minimum time between blocks (prevents rapid block mining)
        min_block_spacing_ms: 60000              # 60 seconds (1 minute minimum)
        # Maximum time before difficulty emergency reduction kicks in
        max_block_time_s: 3600                   # 3600 seconds (1 hour maximum)
        # Block subsidy schedule: exponential decay toward a tail emission
        subsidy:
          start_nANM_per_block: 300000000000  # 300 ANM per block base reward
          epoch_length_blocks: 1350000         # 1.35M blocks per halving epoch
          decay_pct_per_epoch: 50.0            # 50% decay per epoch (true halving)
          tail_nANM_per_block: 100000          # 0.0001 ANM tail (never below this)
          max_halvings: 64
        # Split of block subsidy (fees configured below)
        subsidy_split_pct:
          miner: 100
          aicf: 0
          treasury: 0
      fees:
        base_fee:
          burn_pct: 50                         # % of base fee burned
          treasury_pct: 25                     # of base fee (post-burn) to treasury
          aicf_pct: 25                         # of base fee (post-burn) to AICF
        tips_split_pct:
          miner: 90
          aicf: 10
    consensus:
      poies:
        theta_initial_munats: 24000000         # Θ₀ in µ-nats
        theta_min_munats: 12000000
        theta_max_munats: 3000000000           # Hard cap at 3B µ-nats (3,000 nats) for network stability
        retarget:
          window_blocks: 720                   # ~60 hours at 300s
          ema_beta: 0.15                       # fractional step toward target
          clamp_ratio_per_window:
            min: 0.5
            max: 2.0
        share_target_munats: 4000000           # micro-target for useful shares
        nullifier_ttl_blocks: 65536            # proof reuse prevention horizon
        gamma:
          total_cap_munats: 12000000           # Σψ cap per block before Θ comparison
          escort_quantile: 0.2                 # diversity escort parameter (policy uses this)
      fairness_alpha:
        epoch_blocks: 432000                   # ~10 days
        step_per_epoch: 0.002
        bounds:
          min: 0.5
          max: 1.5
    blocks:
      version: 1
      max_bytes: 2000000                       # 2 MiB envelope (excl. blobs)
      max_gas: 40000000                        # gas for VM execution
      max_txs: 20000
      max_proofs:
        hashshare: 16384
        ai: 512
        quantum: 256
        storage: 4096
        vdf: 1
      receipts_inclusion: true
    data_availability:
      blob_max_bytes_per_block: 33554432       # 32 MiB
      erasure:
        k: 16
        n: 32
        shard_bytes: 1024
      nmt:
        namespace_bits: 32
      das:
        target_failure_prob: "1e-9"
        min_samples: 30
        max_samples: 200
    vm:
      gas_table_file: "spec/opcodes_vm_py.yaml"
      base_tx_gas: 5000
      max_code_bytes: 131072
      max_stack_depth: 1024
    randomness:
      round_seconds: 300
      reveal_grace_seconds: 30
      vdf:
        iterations: 1000000
        modulus_bits: 2048
    p2p:
      default_ports:
        tcp: 36200
        quic: 36201
        ws: 36202
      max_peers: 64
      gossip_target_degree: 8

  # ----------------------------- TESTNET --------------------------------------
  "animica:2":
    name: "Animica Testnet"
    symbol: "tANM"
    decimals: 9
    genesis_time_utc: "TBD"
    system_addresses:
      treasury: "anim1ttreasuryxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      aicf_treasury: "anim1taicfxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
