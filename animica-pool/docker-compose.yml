services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: animica
      POSTGRES_PASSWORD: animica
      POSTGRES_DB: animica_pool
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - animica_pool_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animica -d animica_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - animica_pool_redis:/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://animica:animica@postgres:5432/animica_pool?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:4000:4000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  animica_pool_pg:
  animica_pool_redis:
