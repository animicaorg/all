<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060f"/>
      <stop offset="1" stop-color="#0a0c18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3df5a0"/>
      <stop offset="1" stop-color="#5ad0ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <!-- glow orb -->
  <circle cx="980" cy="150" r="220" fill="#3df5a0" opacity="0.07"/>
  <circle cx="980" cy="150" r="120" fill="#5ad0ff" opacity="0.06"/>

  <text x="80" y="150" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#7be3b5" font-weight="700" letter-spacing="4">ANIMICA POOL</text>

  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="76" fill="#ffffff" font-weight="800">Mine ANM + Monero</text>
  <text x="78" y="358" font-family="Arial, Helvetica, sans-serif" font-size="76" fill="#ffffff" font-weight="800">with <tspan fill="#3df5a0">one command</tspan>.</text>

  <text x="80" y="430" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#aeb6c6">Dual CPU mining · RandomX + SHA3 · pay in ANM or XMR · live stats</text>

  <!-- command chip -->
  <rect x="80" y="476" width="1040" height="78" rx="14" fill="#0e1322" stroke="#1d2740"/>
  <text x="108" y="525" font-family="'Courier New', monospace" font-size="30" fill="#3df5a0">$ animica miner dual-mine &lt;your-anim1-address&gt; --pool-host pool.animica.org</text>

  <text x="80" y="600" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#6b7488">pool.animica.org</text>
</svg>
