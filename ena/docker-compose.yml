version: '3.8'

services:
  ena-node:
    build:
      context: .
      dockerfile: ena/Dockerfile
    container_name: ena-node
    ports:
      - "8080:8080"
    environment:
      - ENA_RPC_URL=${ENA_RPC_URL:-https://mainnet.animica.org/rpc}
      - ENA_SERVICE_ADDRESS=${ENA_SERVICE_ADDRESS}
      - ENA_FEE_PER_CALL=${ENA_FEE_PER_CALL:-10000000}
      - ENA_FEE_PER_TOKEN=${ENA_FEE_PER_TOKEN:-1000}
      - ENA_DB_PATH=/data/ena.db
      - ENA_DEFAULT_MODEL=${ENA_DEFAULT_MODEL:-ena.tiny.v1}
      - ENA_ADMIN_TOKEN=${ENA_ADMIN_TOKEN}
      - ENA_HOST=0.0.0.0
      - ENA_PORT=8080
      - ENA_LOG_FILE=/data/ena.log
      - ENA_MODELS_DIR=/app/ena/models
      - ENA_DEV_MODE=${ENA_DEV_MODE:-0}
    volumes:
      - ena-data:/data
      - ./ena/models:/app/ena/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ena-data:
    driver: local
