# Installer manifest for Animica Internet 0.1.0
#
# Facts verified 2026-08-03 from the actual artifact + the CI build script
# (apps/animica-internet/packaging/build_windows.ps1 in animicaorg/all):
#   * Installer is INNO SETUP (built with iscc; choco-installed innosetup in CI).
#     winget drives Inno silent installs automatically; the manual silent flags
#     are /VERYSILENT /SUPPRESSMSGBOXES /NORESTART.
#   * Inno [Setup] AppId is "{9C4E7A2D-5B31-4F8E-B6D0-ANMINTERNET1}" so the
#     uninstall ProductCode is that AppId + "_is1".
#   * PrivilegesRequired=lowest with PrivilegesRequiredOverridesAllowed=dialog
#     -> per-user install by default (Scope: user).
#   * InstallerSha256 computed locally from the exact .exe bytes
#     (270,374,484 bytes) and cross-checked against the published .sha256
#     sidecar; artifact built 2026-07-27.
#
# 2026-08-03: /internet downloads restored from backup and re-published under
# the immutable versioned path /internet/0.1.0/ (sha256 verified against the
# .sha256 sidecars). InstallerUrl below points at the versioned copy, which
# must never be overwritten for PackageVersion 0.1.0.
PackageIdentifier: Animica.AnimicaInternet
PackageVersion: 0.1.0
InstallerLocale: en-US
InstallerType: inno
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
ReleaseDate: 2026-07-27
Installers:
  - Architecture: x64
    InstallerUrl: https://animica.org/internet/0.1.0/animica-internet-windows-x64-setup.exe
    InstallerSha256: 65FEE7FF83C7593204BF000FB468D996F88AE196446917AB53CD070EBAE82D9B
    ProductCode: "{9C4E7A2D-5B31-4F8E-B6D0-ANMINTERNET1}_is1"
ManifestType: installer
ManifestVersion: 1.12.0
