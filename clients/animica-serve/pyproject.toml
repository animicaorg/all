[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animica-serve"
version = "0.1.1"
description = "Serve Animica AICF inference jobs from anything with a CPU — phones under Termux included. Torch-free: llama.cpp does the inference, this package does the earning."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Animica" }]
keywords = ["animica", "aicf", "llama.cpp", "termux", "inference", "depin"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Android",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
]
# Deliberately ZERO runtime dependencies: stdlib only. The inference engine is
# llama.cpp (Termux: `pkg install llama-cpp`) or, optionally, llama-cpp-python.
dependencies = []

[project.optional-dependencies]
python-backend = ["llama-cpp-python>=0.2.90"]

[project.urls]
Homepage = "https://pool.animica.org/serve"
Documentation = "https://pool.animica.org/serve"

[project.scripts]
animica-serve = "animica_serve.main:cli"
