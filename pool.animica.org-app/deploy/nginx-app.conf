# Add inside the existing `server { server_name pool.animica.org; ... }`
# block in /etc/nginx/sites-available/pool.animica.org.conf, alongside the
# existing /api/, /v1/, /healthz proxies (which go to the pool on :8550).
#
# The marketplace Next.js app runs on 127.0.0.1:3020 with basePath=/app, so
# everything under /app (pages + /app/api/* + /app/api/webhooks/nowpayments)
# is served by it. The pool's /api/* stays untouched.

location /app/ {
    proxy_pass         http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
location = /app {
    return 301 /app/;
}
