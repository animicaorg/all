# Replace the `location / { ... }` block in
# /etc/nginx/sites-available/studio.animica.org.conf with this to go live.
# The broker (127.0.0.1:8123) serves a login page at / and only streams a
# user's noVNC session AFTER auth — an authenticated endpoint, not an open shell.
location / {
    proxy_pass http://127.0.0.1:8123;
    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 4m;
}
