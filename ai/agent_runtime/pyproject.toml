[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent_runtime"
version = "0.1.0"
description = "Animica agent runtime: AICF-paid distributed chat client and shared config/logging primitives."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Animica" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pyyaml>=6.0.1",
  "pydantic>=2.7.0",
  "typer>=0.12.3",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "platformdirs>=4.0.0",
]

[project.optional-dependencies]
chat = [
  "prompt_toolkit>=3.0.43",
]
ipfs = [
  # Used by the bundle propagation code to push/pull through a local
  # ipfs daemon's HTTP API. We use the official `ipfshttpclient` when
  # available and fall back to plain httpx against the gateways.
  "ipfshttpclient>=0.8.0a2",
]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.scripts]
# CLI entrypoint used by `animica chat`. The animica python CLI re-exports
# this under the top-level `animica chat` namespace; advanced users can
# also call it directly.
animica-chat = "agent_runtime.cli.chat:main"
animica-agent-runtime = "agent_runtime.cli.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.hatch.build.targets.wheel.sources]
"src/agent_runtime" = "agent_runtime"
