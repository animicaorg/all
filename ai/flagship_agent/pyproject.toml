[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flagship_agent"
version = "0.1.0"
description = "Animica flagship coding-agent training pipeline + offline inference fallback."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Animica" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  # Shared primitives.
  "agent_runtime>=0.1.0",
  "pyyaml>=6.0.1",
  "pydantic>=2.7.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "datasketch>=1.6.4",   # MinHash + LSH for near-dedupe
]

[project.optional-dependencies]
training = [
  "torch>=2.2.0",
  "transformers>=4.44.0",
  "accelerate>=0.34.0",
  "datasets>=2.20.0,<4.0.0",
  "peft>=0.11.0",        # LoRA adapters
  "sentencepiece>=0.2.0",
  "tokenizers>=0.20.0",
  "safetensors>=0.4.5",
]
inference = [
  "torch>=2.2.0",
  "transformers>=4.44.0",
  "tokenizers>=0.20.0",
  "safetensors>=0.4.5",
]
indices = [
  "rank_bm25>=0.2.2",
]
ipfs = [
  "ipfshttpclient>=0.8.0a2",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.scripts]
flagship-train = "flagship_agent.cli:train_main"
flagship-export = "flagship_agent.cli:export_main"
flagship-smoke = "flagship_agent.cli:smoke_main"

[tool.hatch.build.targets.wheel]
packages = ["src/flagship_agent"]

[tool.hatch.build.targets.wheel.sources]
"src/flagship_agent" = "flagship_agent"
