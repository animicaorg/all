[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animica-node"
version = "0.1.0"
description = "Animica node packages"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = [
  "core*",
  "rpc*",
  "p2p*",
  "consensus*",
  "execution*",
  "mining*",
  "wallet*",
  "mempool*",
  "pq*",
  "randomness*",
]
exclude = [
  "*.tests",
  "*.tests.*",
  "tests*",
  "*tests",
  "*fixtures*",
]
