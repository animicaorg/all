[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animica"
version = "0.1.0"
description = "Animica CLI + client libs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "cbor2>=5.6.0",
  "oqs>=0.14.0,<0.15.0",
  "animica-pq>=0.1.0",
]

[project.scripts]
animica = "animica.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
  "omni-sdk>=0.1.0",
]
