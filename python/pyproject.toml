[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animica"
version = "0.1.53"
description = "Animica blockchain CLI and client libraries — node, wallet, miner, contracts, and useful-work jobs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["animica", "blockchain", "cli", "node", "wallet", "miner", "useful-work"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.44,<3.0.0",
  "alembic>=1.17.0,<2.0.0",
  "psycopg[binary]>=3.2.12,<4.0.0",
  "eth-account>=0.13.7,<1.0.0",
  "web3>=7.14.0,<8.0.0",
  "pyyaml>=6.0.1",
  "cbor2>=5.6.0",
  "requests>=2.31.0",
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
  "huggingface_hub>=0.24.0",
]

[project.scripts]
animica = "animica.cli.main:main"

[project.optional-dependencies]
backend = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
stratum = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
wallet_qt = [
  "segno>=1.6.1,<2.0.0",
  "pypng>=0.20220715.0",
]
operator = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
  "omni-sdk>=0.1.0",
  "respx>=0.22",
]
bridge = [
  "sqlalchemy>=2.0.44,<3.0.0",
  "alembic>=1.17.0,<2.0.0",
  "psycopg[binary]>=3.2.12,<4.0.0",
  "eth-account>=0.13.7,<1.0.0",
  "web3>=7.14.0,<8.0.0",
]
gpu = [
  "torch>=2.2.0",
  "accelerate>=0.34.0,<1.0.0",
  "transformers>=4.44.0,<5.0.0",
  "datasets>=2.20.0,<4.0.0",
  "sentence-transformers>=2.7.0,<6.0.0",
]
all = [
  "animica[backend,stratum,wallet_qt,operator,bridge,gpu]",
]

[project.urls]
Homepage = "https://animica.org"
Repository = "https://github.com/animicaorg/all"
Documentation = "https://animica.org/docs"
Issues = "https://github.com/animicaorg/all/issues"

[tool.hatch.build.targets.wheel]
packages = ["animica"]

[tool.hatch.build.targets.wheel.force-include]
# Top-level sibling Python packages imported as `<name>.*` from animica
# at module-load time. They live next to python/ in the source tree but are
# not pip-installable on their own, so bundle them so a pip-only `animica`
# wheel can import without external setup.
"../aicf" = "aicf"
"../capabilities" = "capabilities"
"../consensus" = "consensus"
"../core" = "core"
"../coretx" = "coretx"
"../da" = "da"
"../execution" = "execution"
"../mempool" = "mempool"
"../mempool2" = "mempool2"
"../mining" = "mining"
"../p2p" = "p2p"
"../pq" = "pq"
"../rpc" = "rpc"
"../stdlib" = "stdlib"
"../vm_py" = "vm_py"
# AI stack — distributed AICF chat client + local flagship pipeline.
# Bundled at top-level so `pip install animica` delivers `animica chat`
# and the training pipeline together, no extra installs needed.
"../ai/agent_runtime/src/agent_runtime" = "agent_runtime"
"../ai/flagship_agent/src/flagship_agent" = "flagship_agent"
"../ai/configs" = "animica/_data/ai/configs"
"../ai/flagship_agent/scripts" = "animica/_data/ai/flagship_agent/scripts"
# Standalone (image:-based) docker-compose files so `pip install animica`
# + `animica node up` works without a source-tree checkout. See
# python/animica/config.py::_resolve_compose_file for resolution order.
"../ops/docker/standalone" = "animica/_data/ops/docker/standalone"

[tool.hatch.build.targets.sdist]
include = [
  "animica",
  "../aicf",
]
