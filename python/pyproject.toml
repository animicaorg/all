[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animica"
version = "8.0.0"
description = "Animica blockchain CLI and client libraries — node, wallet, miner, contracts, useful-work jobs, and Animica Studio serverless compute."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["animica", "blockchain", "cli", "node", "wallet", "miner", "useful-work"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.44,<3.0.0",
  "alembic>=1.17.0,<2.0.0",
  "psycopg[binary]>=3.2.12,<4.0.0",
  "eth-account>=0.13.7,<1.0.0",
  "web3>=7.14.0,<8.0.0",
  "pyyaml>=6.0.1",
  "cbor2>=5.6.0",
  # ANM-L01: production AEAD backend for the P2P transport (ChaCha20-Poly1305 /
  # AES-GCM). Without it the handshake falls back to the insecure pure-Python AEAD
  # (allowed with a warning by default; ANIMICA_STRICT_AEAD=1 refuses instead).
  "cryptography>=42.0.0",
  "requests>=2.31.0",
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  # Pin starlette to the band fastapi 0.115.x accepts. WITHOUT this upper bound a
  # transitive dep (notably sse-starlette 3.x via the `mcp` extra) can pull
  # starlette>=0.49, which is INCOMPATIBLE with fastapi 0.115 and crashes EVERY
  # FastAPI service (pool, ENA, gateway) on its next restart with
  # `Router.__init__() got an unexpected keyword argument 'on_startup'`.
  "starlette>=0.40,<0.47",
  "prometheus-client>=0.20.0,<1.0.0",
  "huggingface_hub>=0.24.0",
  # ENA AI training/serving stack — INCLUDED IN THE BASE INSTALL (2026-07-03) so a
  # GPU rig that runs `pip install animica` can train immediately. The
  # python_transformers backend needs torch+transformers+datasets, and LoRA/QLoRA
  # needs peft+accelerate(+bitsandbytes); without them every ENA shard fails with
  # "python_transformers backend needs transformers + datasets (+ torch)". torch's
  # default PyPI wheel is CUDA-enabled on Linux and MPS on Apple Silicon; AMD users
  # install a ROCm torch from AMD's index. This makes the base install heavy
  # (torch is ~GB); the `ai`/`gpu` extras below remain as explicit aliases and are
  # now redundant with the base. bitsandbytes (QLoRA) is Linux-only, so it is
  # environment-gated and simply skipped elsewhere.
  "torch>=2.2.0",
  "accelerate>=1.3.0,<2.0.0",
  "transformers>=4.44.0,<5.0.0",
  # datasets>=3.0 is REQUIRED: the <3 line ships datasets/utils/_dill.py with a
  # Pickler._batch_setitems(self, items) signature that crashes on Python 3.13+
  # ("_batch_setitems() takes 2 positional arguments but 3 were given") because
  # the stdlib pickle._Pickler now calls _batch_setitems(items, obj). dill is
  # datasets' pickling backend; pin a floor whose Pickler matches the new pickle.
  "datasets>=3.0.0,<6.0.0",
  "dill>=0.3.8",
  "sentence-transformers>=2.7.0,<6.0.0",
  "peft>=0.11.0,<1.0.0",
  "trl>=0.12.0,<1.0.0",
  "sentencepiece>=0.2.0",
  "protobuf>=4.23.0",
  "safetensors>=0.4.0",
  "scipy>=1.11.0",
  "einops>=0.7.0",
  "bitsandbytes>=0.43.0 ; platform_system == 'Linux'",
  # Native SHA3-256 CPU-miner fast path — shipped BY DEFAULT so `pip install
  # animica` + `animica up` (and the miner archives) get native hashrate with no
  # extra step. Its build is tolerant: on a platform with no prebuilt wheel and
  # no C compiler it installs a pure-Python no-op (available()==False) and the
  # miner falls back, so this can never break the install. Prebuilt wheels:
  # Linux on PyPI; Windows/macOS via the fastpow-wheels CI (Trusted Publishing).
  "animica-fastpow>=1.0.1",
]

[project.scripts]
animica = "animica.cli.main:main"

[project.optional-dependencies]
backend = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
stratum = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
# Native CPU-miner fast path (real multi-core hashrate). OPT-IN and isolated:
# kept out of `all`/`stratum` so a missing platform wheel can never break a plain
# `pip install animica[all]`. It needs a prebuilt animica-fastpow wheel for the
# platform (Linux on PyPI; Windows/macOS via the fastpow-wheels CI) or a C
# compiler to build the sdist. The miner imports it if present and otherwise
# falls back to the pure-Python loop, so this is purely an accelerator.
fast = [
  "animica-fastpow>=1.0.0",
]
wallet_qt = [
  "segno>=1.6.1,<2.0.0",
  "pypng>=0.20220715.0",
]
operator = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
  "omni-sdk>=0.1.0",
  "respx>=0.22",
]
bridge = [
  "sqlalchemy>=2.0.44,<3.0.0",
  "alembic>=1.17.0,<2.0.0",
  "psycopg[binary]>=3.2.12,<4.0.0",
  "eth-account>=0.13.7,<1.0.0",
  "web3>=7.14.0,<8.0.0",
]
# AI stack for ENA training/serving + semantic eval (CPU-capable). torch's PyPI
# wheels cover NVIDIA CUDA (Linux) and Apple Silicon MPS; AMD users install a
# ROCm torch from AMD's index. Kept OUT of the base install so a plain
# `pip install animica` stays light and robust.
ai = [
  "torch>=2.2.0",
  "accelerate>=1.3.0,<2.0.0",
  "transformers>=4.44.0,<5.0.0",
  "datasets>=3.0.0,<6.0.0",  # <3 crashes on py3.13+ (_batch_setitems arg count)
  "sentence-transformers>=2.7.0,<6.0.0",
  "peft>=0.11.0,<1.0.0",
  "trl>=0.12.0,<1.0.0",  # DPOTrainer(processing_class=) needs >=0.12
  "sentencepiece>=0.2.0",
  "protobuf>=4.23.0",
  "safetensors>=0.4.0",
  "scipy>=1.11.0",
  "einops>=0.7.0",
]
# GPU = the AI stack plus Linux+CUDA quantization (bitsandbytes).
gpu = [
  "animica[ai]",
  "bitsandbytes>=0.43.0 ; platform_system == 'Linux'",
]
# Generative media (image/video/audio) provider. Miners: pip install 'animica[media]'.
media = [
  "torch>=2.6.0",
  "diffusers>=0.39.0,<1.0.0",
  "transformers>=4.44.0",
  "accelerate>=1.3.0",
  "safetensors>=0.4.0",
  "imageio[ffmpeg]>=2.34.0",
  "Pillow>=10.0.0",
]
# Animica Studio (serverless compute) extras: cloudpickle enables pickle-mode
# serialization (closures/lambdas); omni-sdk enables on-chain ANM escrow for
# remote runs. The SDK itself works without these (ref+JSON serialization,
# local mode), so they're optional.
studio = [
  "cloudpickle>=3.0.0",
  "omni-sdk>=0.1.0",
]
# Model Context Protocol (MCP) server — `animica mcp serve` exposes Animica's
# READ + COMPUTE tools (ENA inference, verifiable quantum randomness, qDNA
# verification, Studio compute estimate, chain/pool reads) to MCP clients in BOTH
# the Anthropic/Claude (stdio) and OpenAI Apps SDK (streamable-HTTP) ecosystems.
# Kept OUT of the base install: `animica mcp serve` lazily imports the SDK and
# prints a `pip install "animica[mcp]"` hint if it is absent. httpx is already a
# base dependency; it is repeated here so `pip install animica[mcp]` is complete.
mcp = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
  # Cap sse-starlette below 3.x: the 3.x line requires starlette>=0.49 which
  # conflicts with the base `starlette<0.47` pin (fastapi 0.115). 2.x satisfies
  # mcp's `sse-starlette>=1.6.1` requirement and works with starlette 0.46.
  "sse-starlette>=1.6.1,<3",
]
# Provider role: run as an Animica AI compute provider — serve an OpenAI-compatible
# endpoint (`animica ai serve`) and settle earnings on-chain. This is the light
# provider runtime (gateway + on-chain SDK); GPU compute is added separately with
# `animica[gpu]`. Use: `pip install "animica[provider]"` (or `"animica[provider,gpu]"`).
provider = [
  "animica[backend]",
  "omni-sdk>=0.1.0",
]
# EVM execution lane (ANIMICA_EVM_EXECUTION=1): embeds py-evm so real Solidity
# contracts deploy and run on a node-local EVM sequencer (chain id 149). Optional;
# if absent the lane stays disabled and the rest of the EVM facade is unaffected.
# The native-ANM ERC-20 read facade needs no extra deps.
evm = [
  "py-evm>=0.10.1b1",
]
# NOTE: `fast` (native miner) is intentionally NOT in `all` — it requires a
# platform-specific native wheel and must never break a plain `animica[all]`
# install. Add it explicitly: `pip install "animica[all,fast]"`.
all = [
  "animica[backend,stratum,wallet_qt,operator,bridge,gpu,ai,studio,mcp,provider]",
]

[project.urls]
Homepage = "https://animica.org"
Repository = "https://github.com/animicaorg/all"
Documentation = "https://animica.org/docs"
Issues = "https://github.com/animicaorg/all/issues"

[tool.hatch.build.targets.wheel]
packages = ["animica"]

# Keep the wheel release-quality: no bytecode caches, editor/patch backups, test
# trees (which also carried test-key fixtures), or stray secrets.
exclude = [
  "**/__pycache__",
  "**/__pycache__/**",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.bak",
  "**/*.bak_*",
  "**/*.fix_*",
  "**/*.orig",
  "**/*.rej",
  "**/tests",
  "**/tests/**",
  "**/test_*.py",
  "**/mykey.json",
  "**/tx.json",
]

# Custom build hook materialises sibling source dirs (../aicf,
# ../ai/agent_runtime/src/agent_runtime, etc.) into python/_build_vendor/
# before the wheel/sdist is assembled. See python/hatch_build.py for the
# list of vendored paths and the rationale (hatchling's sdist `include`
# silently ignores paths above the project root, which used to break
# `python -m build`).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
# Top-level sibling Python packages imported as `<name>.*` from animica
# at module-load time. They live next to python/ in the source tree;
# the build hook copies them into _build_vendor/ so both wheel-from-source
# and wheel-from-sdist see them at a stable, in-project path.
"_build_vendor/aicf" = "aicf"
"_build_vendor/capabilities" = "capabilities"
"_build_vendor/consensus" = "consensus"
"_build_vendor/core" = "core"
"_build_vendor/coretx" = "coretx"
"_build_vendor/da" = "da"
"_build_vendor/execution" = "execution"
"_build_vendor/mempool" = "mempool"
"_build_vendor/mempool2" = "mempool2"
"_build_vendor/mining" = "mining"
"_build_vendor/p2p" = "p2p"
"_build_vendor/pq" = "pq"
"_build_vendor/randomness" = "randomness"
"_build_vendor/rpc" = "rpc"
"_build_vendor/stdlib" = "stdlib"
"_build_vendor/vm_py" = "vm_py"
# AI stack — distributed AICF chat client + local flagship pipeline.
# Bundled at top-level so `pip install animica` delivers `animica chat`
# and the training pipeline together, no extra installs needed.
"_build_vendor/agent_runtime" = "agent_runtime"
"_build_vendor/flagship_agent" = "flagship_agent"
"_build_vendor/_data_ai_configs" = "animica/_data/ai/configs"
"_build_vendor/_data_ai_flagship_agent_scripts" = "animica/_data/ai/flagship_agent/scripts"
# Standalone (image:-based) docker-compose files so `pip install animica`
# + `animica node up` works without a source-tree checkout. See
# python/animica/config.py::_resolve_compose_file for resolution order.
"_build_vendor/_data_ops_docker_standalone" = "animica/_data/ops/docker/standalone"

[tool.hatch.build.targets.sdist]
# Include the materialised vendor dir + the hook script. The hook runs
# first thing in every build, so _build_vendor/ is always populated
# from the latest source before hatchling reads it. The same dir is
# packed into the sdist, so wheel-from-sdist also has all the inputs.
include = [
  "animica",
  "_build_vendor",
  "hatch_build.py",
]
