[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animica"
version = "0.4.4"
description = "Animica blockchain CLI and client libraries — node, wallet, miner, contracts, and useful-work jobs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["animica", "blockchain", "cli", "node", "wallet", "miner", "useful-work"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.44,<3.0.0",
  "alembic>=1.17.0,<2.0.0",
  "psycopg[binary]>=3.2.12,<4.0.0",
  "eth-account>=0.13.7,<1.0.0",
  "web3>=7.14.0,<8.0.0",
  "pyyaml>=6.0.1",
  "cbor2>=5.6.0",
  "requests>=2.31.0",
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
  "huggingface_hub>=0.24.0",
]

[project.scripts]
animica = "animica.cli.main:main"

[project.optional-dependencies]
backend = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
stratum = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
wallet_qt = [
  "segno>=1.6.1,<2.0.0",
  "pypng>=0.20220715.0",
]
operator = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
  "omni-sdk>=0.1.0",
  "respx>=0.22",
]
bridge = [
  "sqlalchemy>=2.0.44,<3.0.0",
  "alembic>=1.17.0,<2.0.0",
  "psycopg[binary]>=3.2.12,<4.0.0",
  "eth-account>=0.13.7,<1.0.0",
  "web3>=7.14.0,<8.0.0",
]
gpu = [
  "torch>=2.2.0",
  "accelerate>=0.34.0,<1.0.0",
  "transformers>=4.44.0,<5.0.0",
  "datasets>=2.20.0,<4.0.0",
  "sentence-transformers>=2.7.0,<6.0.0",
]
all = [
  "animica[backend,stratum,wallet_qt,operator,bridge,gpu]",
]

[project.urls]
Homepage = "https://animica.org"
Repository = "https://github.com/animicaorg/all"
Documentation = "https://animica.org/docs"
Issues = "https://github.com/animicaorg/all/issues"

[tool.hatch.build.targets.wheel]
packages = ["animica"]

# Custom build hook materialises sibling source dirs (../aicf,
# ../ai/agent_runtime/src/agent_runtime, etc.) into python/_build_vendor/
# before the wheel/sdist is assembled. See python/hatch_build.py for the
# list of vendored paths and the rationale (hatchling's sdist `include`
# silently ignores paths above the project root, which used to break
# `python -m build`).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
# Top-level sibling Python packages imported as `<name>.*` from animica
# at module-load time. They live next to python/ in the source tree;
# the build hook copies them into _build_vendor/ so both wheel-from-source
# and wheel-from-sdist see them at a stable, in-project path.
"_build_vendor/aicf" = "aicf"
"_build_vendor/capabilities" = "capabilities"
"_build_vendor/consensus" = "consensus"
"_build_vendor/core" = "core"
"_build_vendor/coretx" = "coretx"
"_build_vendor/da" = "da"
"_build_vendor/execution" = "execution"
"_build_vendor/mempool" = "mempool"
"_build_vendor/mempool2" = "mempool2"
"_build_vendor/mining" = "mining"
"_build_vendor/p2p" = "p2p"
"_build_vendor/pq" = "pq"
"_build_vendor/rpc" = "rpc"
"_build_vendor/stdlib" = "stdlib"
"_build_vendor/vm_py" = "vm_py"
# AI stack — distributed AICF chat client + local flagship pipeline.
# Bundled at top-level so `pip install animica` delivers `animica chat`
# and the training pipeline together, no extra installs needed.
"_build_vendor/agent_runtime" = "agent_runtime"
"_build_vendor/flagship_agent" = "flagship_agent"
"_build_vendor/_data_ai_configs" = "animica/_data/ai/configs"
"_build_vendor/_data_ai_flagship_agent_scripts" = "animica/_data/ai/flagship_agent/scripts"
# Standalone (image:-based) docker-compose files so `pip install animica`
# + `animica node up` works without a source-tree checkout. See
# python/animica/config.py::_resolve_compose_file for resolution order.
"_build_vendor/_data_ops_docker_standalone" = "animica/_data/ops/docker/standalone"

[tool.hatch.build.targets.sdist]
# Include the materialised vendor dir + the hook script. The hook runs
# first thing in every build, so _build_vendor/ is always populated
# from the latest source before hatchling reads it. The same dir is
# packed into the sdist, so wheel-from-sdist also has all the inputs.
include = [
  "animica",
  "_build_vendor",
  "hatch_build.py",
]
