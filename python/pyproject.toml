[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animica"
version = "0.1.0"
description = "Animica CLI + client libs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "cbor2>=5.6.0",
  "requests>=2.31.0",
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]

[project.scripts]
animica = "animica.cli.main:main"

[project.optional-dependencies]
backend = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
ena = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
  "pypdf>=5.0.0",
  "pyarrow>=17.0.0",
  "datasets>=2.20.0,<4.0.0",
  "transformers>=4.44.0,<5.0.0",
  "accelerate>=0.34.0,<1.0.0",
]
stratum = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
wallet_qt = [
  "segno>=1.6.1,<2.0.0",
  "pypng>=0.20220715.0",
]
operator = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
  "omni-sdk>=0.1.0",
  "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["animica"]
