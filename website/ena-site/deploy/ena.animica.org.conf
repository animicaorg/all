# ena.animica.org — ENA: open AI training & inference network.
#
# Static landing in /var/www/ena.animica.org + a live stats/jobs API proxied
# to the ENA coordinator (animica-ena.service on 127.0.0.1:8791).
#
# Go-live (once DNS A/AAAA for ena.animica.org points at this host):
#   ln -s /etc/nginx/sites-available/ena.animica.org.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ena.animica.org      # provisions TLS, rewrites :80 -> :443
#
# NOTE: 8787 is taken (main-site /launcher-api); the ENA coordinator uses 8791.

server {
    listen 80;
    listen [::]:80;
    server_name ena.animica.org;

    access_log /var/log/nginx/ena.animica.org.access.log;
    error_log  /var/log/nginx/ena.animica.org.error.log;

    root /var/www/ena.animica.org;
    index index.html;

    # Live stats + job queue → ENA coordinator. /api/stats -> :8791/stats
    location /api/ {
        proxy_pass http://127.0.0.1:8791/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|woff2?|png|jpg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
