# ena.animica.org — RETIRED. Consolidated into pool.animica.org.
#
# The standalone ENA static site has been retired. Everything it offered now
# lives on pool.animica.org (pool dashboard + /about-ena + /training-pools).
# This vhost is a permanent (301) redirect to pool.animica.org. The archived
# static files (index.html / ena.js) remain in website/ena-site/ for reference
# but are no longer served. See website/ena-site/DEPRECATED.md.
#
# NOTE: only the static SITE is retired. The ENA coordinator backend still runs
# (animica ena serve / animica-ena.service on 127.0.0.1:8791) and is reached
# through pool.animica.org, not here.
#
# Reload after editing:
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name ena.animica.org;

    access_log /var/log/nginx/ena.animica.org.access.log;
    error_log  /var/log/nginx/ena.animica.org.error.log;

    return 301 https://pool.animica.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ena.animica.org;

    access_log /var/log/nginx/ena.animica.org.access.log;
    error_log  /var/log/nginx/ena.animica.org.error.log;

    # Existing certbot-managed certificate (provisioned via
    #   certbot --nginx -d ena.animica.org).
    ssl_certificate     /etc/letsencrypt/live/ena.animica.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ena.animica.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://pool.animica.org$request_uri;
}
