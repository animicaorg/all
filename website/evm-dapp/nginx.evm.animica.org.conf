server {
    server_name evm.animica.org;
    root /var/www/evm.animica.org;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin JSON-RPC proxy so the dApp avoids cross-origin CORS to the node.
    location /rpc {
        proxy_pass http://127.0.0.1:8545/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/evm.animica.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/evm.animica.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = evm.animica.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name evm.animica.org;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}