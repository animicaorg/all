# beacon.animica.org -> the public beacon service on 127.0.0.1:8780
# Put in /etc/nginx/sites-available/ and `certbot --nginx -d beacon.animica.org`.
server {
    listen 80;
    server_name beacon.animica.org;
    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Public read-only API: light caching for the latest round is fine.
        proxy_read_timeout 30s;
    }
}
