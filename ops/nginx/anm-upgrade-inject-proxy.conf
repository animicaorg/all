# Animica network-upgrade notice — proxied-app variant. Forces uncompressed
# upstream so sub_filter can match, then injects the central banner script.
# Include INSIDE the HTML-serving `location /` of a proxied app.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter_types text/html;
sub_filter '</body>' '<script defer src="https://animica.dev/anm-upgrade-banner.js"></script></body>';
