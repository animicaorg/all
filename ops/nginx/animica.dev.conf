server {
    server_name animica.dev www.animica.dev;

    access_log /var/log/nginx/animica.dev.access.log;
    error_log  /var/log/nginx/animica.dev.error.log;

    root /var/www/animica.dev;
    index index.html;

    # Static portal
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(js|css|svg|png|jpg|webp|woff2|ico|xml|txt|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Verifiable Inference Engine — OpenAI-compatible gateway (animica ai serve)
    # FREE public OpenAI-compatible endpoint (treasury-funded). No API key needed —
    # nginx injects a server-side key so bots and browsers can call it directly.
    location /v1/ {
        # CORS so any origin / AI bot can call the free API.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        limit_req zone=anmai burst=12 nodelay;

        # Served by the miner network via the keyless chat-bridge (OpenAI -> on-chain
        # AICF job -> whichever miner claims it). No AI runs on this box.
        proxy_pass http://127.0.0.1:4600/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # On-chain settlement + miner inference can be slow; support SSE streaming.
        proxy_buffering off;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 15s;
        client_max_body_size  8m;
    }
    # Free GitHub coding agent backend (treasury-funded; user supplies a GitHub
    # token per-request, never stored). Agent loops can be slow on CPU.
    # Expensive: each POST spawns a background build + burns the miner. Rate-limited
    # harder than the rest of /agent/. Exact-match so it wins over the /agent/ prefix.
    location = /agent/swarm/start {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Content-Length 0;
            return 204;
        }
        limit_req zone=anmbuild burst=4 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout    120s;
        proxy_connect_timeout 15s;
        client_max_body_size  4m;
    }

    location /agent/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 15s;
        client_max_body_size  40m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8792/health;
        proxy_set_header Host $host;
    }

    # Live network height for the cross-site upgrade banner (CORS-enabled, cheap
    # static JSON refreshed by animica-net-height.timer).
    location = /net-height {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        alias /var/www/animica.dev/net-height.json;
    }

    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; }
    location = /sw.js { default_type application/javascript; add_header Cache-Control "no-cache" always; }

    # Live free-AI traffic stats (refreshed by animica-ai-stats.timer).
    location = /ai-stats.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        alias /var/www/animica.dev/ai-stats.json;
    }

    # Read-only JSON-RPC (for the live network stats on the portal)
    location = /rpc {
        proxy_pass http://127.0.0.1:8545/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host              rpc.animica.org;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        client_max_body_size 256k;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/animica.dev/fullchain.pem; # managed by Certbot
    include /etc/nginx/snippets/anm-upgrade-inject.conf;
    ssl_certificate_key /etc/letsencrypt/live/animica.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.animica.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = animica.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name animica.dev www.animica.dev;
    return 404; # managed by Certbot




}