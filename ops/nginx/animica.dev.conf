server {
    server_name animica.dev www.animica.dev;

    access_log /var/log/nginx/animica.dev.access.log;
    error_log  /var/log/nginx/animica.dev.error.log;

    root /var/www/animica.dev;
    index index.html;

    # Static portal
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(js|css|svg|png|jpg|webp|woff2|ico|xml|txt|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Verifiable Inference Engine — OpenAI-compatible gateway (animica ai serve)
    location /v1/ {
        proxy_pass http://127.0.0.1:8792/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM responses on CPU can be slow; support SSE streaming.
        proxy_buffering off;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 15s;
        client_max_body_size  8m;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8792/health;
        proxy_set_header Host $host;
    }

    # Read-only JSON-RPC (for the live network stats on the portal)
    location = /rpc {
        proxy_pass http://127.0.0.1:8545/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host              rpc.animica.org;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        client_max_body_size 256k;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/animica.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/animica.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.animica.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = animica.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name animica.dev www.animica.dev;
    return 404; # managed by Certbot




}