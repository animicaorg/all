# Animica network-upgrade notice — injects the central banner script before
# </body> on HTML responses. Temporary: remove the `include` lines (or empty
# https://animica.dev/anm-upgrade-banner.js) to retire the banner network-wide.
sub_filter_once on;
sub_filter_types text/html;
sub_filter '</body>' '<script defer src="https://animica.dev/anm-upgrade-banner.js"></script></body>';
