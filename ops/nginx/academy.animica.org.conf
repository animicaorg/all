# Static academy frontend at academy.animica.org.
# After certbot --nginx runs, the SSL stanza below is appended/edited
# in place; keep both the HTTP redirect and the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name academy.animica.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name academy.animica.org;

    root /var/www/academy.animica.org;
    index index.html;

    access_log /var/log/nginx/academy.animica.org.access.log;
    error_log  /var/log/nginx/academy.animica.org.error.log;

    client_max_body_size 5M;

    ssl_certificate /etc/letsencrypt/live/academy.animica.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.animica.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-cache fingerprinted assets; HTML is no-cache.
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot|otf|map|txt|xml|json|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
