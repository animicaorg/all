# Free Animica AI endpoint abuse guard (treasury-funded, keyless /v1).
limit_req_zone $binary_remote_addr zone=anmai:10m rate=30r/m;
# Background build starts are expensive (spawn a server-side build task + burn the
# miner), so cap them harder than ordinary requests. Only the /agent/swarm/start
# endpoint uses this — the SSE /events stream and polled /status are left unthrottled.
limit_req_zone $binary_remote_addr zone=anmbuild:10m rate=12r/m;
limit_req_status 429;
