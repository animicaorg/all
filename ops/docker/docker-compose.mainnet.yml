# Animica Mainnet
# -------------------------------------------------------------------
# Production mainnet node configuration with:
#   - Node (RPC+WS on 8545) - mainnet chain ID 1
#   - Optional miner
#   - Optional studio-services (deploy/verify API)
#   - Optional explorer-web
#
# Usage:
#   animica network set mainnet
#   animica node up
#   # or directly:
#   docker compose -f ops/docker/docker-compose.mainnet.yml up -d
#
# Notes:
# - Uses mainnet chain ID (1)
# - Uses a named Docker volume for node data by default
# - Optional bind mount: set ANIMICA_DATA_MOUNT_SOURCE=/absolute/path
# - Isolated volume for services data: mainnet_services_data
# - Genesis: /app/core/genesis/mainnet.json (bundled in image)
# - Data directory isolated to prevent cross-network contamination
# -------------------------------------------------------------------
name: animica-mainnet

networks:
  mainnet:
    driver: bridge

volumes:
  mainnet_node_data:
    # IMPORTANT: this default points to the volume the prod node has been
    # writing into since launch. Changing it silently — or running `docker
    # compose up -d` with a different ANIMICA_NAMED_DATA_VOLUME — recreates
    # the container with an empty volume, which presents as a chain reset
    # (height plummets, miners orphan, peers re-sync from genesis).
    # Past incident: 2026-05-18 height 12289 → 200 after a compose recreate
    # that picked the empty default.
    name: "${ANIMICA_NAMED_DATA_VOLUME:-animica_mainnet_chain_1_31ae91ca_data}"
  mainnet_services_data:
    name: animica_mainnet_services_data

services:
  # ---------------------------------------------------------------
  # Node: core + rpc (+ ws) for mainnet
  # ---------------------------------------------------------------
  node:
    build:
      context: ../..
      dockerfile: ops/docker/node.Dockerfile
    container_name: animica-mainnet-node
    working_dir: /app
    user: "${ANIMICA_RUNTIME_UID:-10001}:${ANIMICA_RUNTIME_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    # Env precedence: shell/--env-file > env_file > defaults in compose.
    env_file:
      - path: ../../.env
        required: false
    volumes:
      - ../..:/app:ro
      # Use a named Docker volume by default to avoid host filesystem permission drift.
      # To bind a host path instead, set ANIMICA_DATA_MOUNT_SOURCE=/absolute/path/on/host
      - ${ANIMICA_DATA_MOUNT_SOURCE:-mainnet_node_data}:/data
    environment:
      # Mainnet chain config
      ANIMICA_NETWORK: "mainnet"
      ANIMICA_COMPOSE_FILE: "${ANIMICA_COMPOSE_FILE:-/app/ops/docker/docker-compose.mainnet.yml}"
      ANIMICA_CHAIN_ID: "${ANIMICA_CHAIN_ID:-1}"
      GENESIS_PATH: "${GENESIS_PATH:-/app/core/genesis/mainnet.json}"
      ANIMICA_GENESIS_PATH: "${ANIMICA_GENESIS_PATH:-/app/core/genesis/mainnet.json}"
      ANIMICA_DATA_DIR: "/data"
      HOME: "/data"
      ANIMICA_HOME: "/data/chain-${ANIMICA_CHAIN_ID:-1}"
      ANIMICA_VOLUME_STRATEGY: "${ANIMICA_VOLUME_STRATEGY:-named}"
      ANIMICA_DATA_MOUNT_SOURCE: "${ANIMICA_NAMED_DATA_VOLUME:-${ANIMICA_DATA_MOUNT_SOURCE:-mainnet_node_data}}"
      ANIMICA_HOST_DATA_DIR: "${ANIMICA_HOST_DATA_DIR:-}"
      ANIMICA_HOST_CHAIN_DIR: "${ANIMICA_HOST_CHAIN_DIR:-}"
      ANIMICA_HOST_SNAPSHOTS_DIR: "${ANIMICA_HOST_SNAPSHOTS_DIR:-}"
      ANIMICA_MEMPOOL_REQUIRE_PERSIST: "${ANIMICA_MEMPOOL_REQUIRE_PERSIST:-0}"
      # AICF settlement: require every chat turn to broadcast a successful
      # payment txn before the job runs. Default-off was for dev/no-peer
      # bringup; in prod a silent rejection (e.g. wallet chain_id=0
      # mismatch) means users chat for free and providers earn nothing.
      ANIMICA_AICF_REQUIRE_SETTLEMENT: "${ANIMICA_AICF_REQUIRE_SETTLEMENT:-1}"
      # RPC server config
      ANIMICA_RPC_HOST: "${ANIMICA_RPC_HOST:-0.0.0.0}"
      ANIMICA_RPC_PORT: "${ANIMICA_RPC_PORT:-8545}"
      ANIMICA_RPC_CORS_ORIGINS: "${ANIMICA_RPC_CORS_ORIGINS:-[\"http://localhost:*\",\"http://127.0.0.1:*\"]}"
      ANIMICA_LOG_LEVEL: "${ANIMICA_LOG_LEVEL:-INFO}"
      SYNC_ENABLED: "${SYNC_ENABLED:-1}"
      # Instant blocks enabled by default for immediate transaction inclusion
      ANIMICA_INSTANT_BLOCKS_ENABLED: "${ANIMICA_INSTANT_BLOCKS_ENABLED:-true}"
      # P2P config - mainnet seeds auto-selected by chain_id
      # Primary config (ANIMICA_P2P_* vars are canonical):
      ANIMICA_P2P_ENABLE: "${ANIMICA_P2P_ENABLE:-true}"
      ANIMICA_P2P_CHAIN_ID: "${ANIMICA_P2P_CHAIN_ID:-1}"  # Auto-loads mainnet seeds
      ANIMICA_P2P_PORT: "${ANIMICA_P2P_PORT:-30333}"
      ANIMICA_P2P_LISTEN_TCP: "${ANIMICA_P2P_LISTEN_TCP:-0.0.0.0:${ANIMICA_P2P_PORT:-30333}}"
      ANIMICA_P2P_LISTEN_QUIC: "${ANIMICA_P2P_LISTEN_QUIC:-0.0.0.0:443}"
      ANIMICA_P2P_ENABLE_TCP: "${ANIMICA_P2P_ENABLE_TCP:-true}"
      ANIMICA_P2P_ENABLE_QUIC: "${ANIMICA_P2P_ENABLE_QUIC:-true}"
      # Optional advertised address (public IP/host for inbound peers):
      # Example: ANIMICA_P2P_ADVERTISE_ADDR=203.0.113.10:30333
      ANIMICA_P2P_ADVERTISE_ADDR: "${ANIMICA_P2P_ADVERTISE_ADDR:-}"
      ANIMICA_P2P_SEEDS: "${ANIMICA_P2P_SEEDS:-}"
      ANIMICA_P2P_DATA_DIR: "/data/chain-${ANIMICA_CHAIN_ID:-1}/p2p"
      ANIMICA_PEER_STORE_PATH: "/data/chain-${ANIMICA_CHAIN_ID:-1}/p2p"
      ANIMICA_SNAPSHOT_DIR: "/data/snapshots"
      # Legacy P2P config (backward compatibility - deprecated):
      P2P_ENABLE: "${P2P_ENABLE:-true}"
      P2P_LISTEN: "${P2P_LISTEN:-0.0.0.0:${ANIMICA_P2P_PORT:-30333}}"
      P2P_SEEDS: "${P2P_SEEDS:-}"
    command: ["/bin/bash", "-c", "python -m rpc"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:8545/rpc
          -H 'content-type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"chain.getHead","params":{}}'
          >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${HOST_RPC_PORT:-8545}:8545"
      - "${HOST_P2P_PORT:-30333}:30333"  # P2P TCP port
      - "${HOST_P2P_QUIC_PORT:-443}:443/udp"  # P2P QUIC port (UDP)
      - "0.0.0.0:${HOST_METRICS_PORT:-9000}:9000"
    networks: [mainnet]
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Miner (optional - use separate profile)
  # ---------------------------------------------------------------
  miner:
    profiles: [miner]
    build:
      context: ../..
      dockerfile: ops/docker/miner.Dockerfile
    container_name: animica-mainnet-miner
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../..:/app:ro
    environment:
      RPC_URL: "${RPC_URL:-http://node:8545}"
      DEVICE: "${MINER_DEVICE:-cpu}"
      THREADS: "${MINER_THREADS:-4}"
      LOG_LEVEL: "${MINER_LOG_LEVEL:-INFO}"
      ANIMICA_NETWORK: "mainnet"
    command: >
      bash -lc "
      set -euo pipefail;
      exec python -m mining.cli.miner --threads $${THREADS} --device $${DEVICE} --rpc $${RPC_URL}
      "
    depends_on:
      node:
        condition: service_healthy
    networks: [mainnet]
    restart: unless-stopped

  # ---------------------------------------------------------------
  # studio-services (optional - use separate profile)
  # ---------------------------------------------------------------
  services:
    profiles: [studio]
    build:
      context: ../../studio-services
      dockerfile: Dockerfile
    container_name: animica-mainnet-services
    environment:
      RPC_URL: "${RPC_URL:-http://node:8545}"
      CHAIN_ID: "${ANIMICA_CHAIN_ID:-1}"
      STORAGE_DIR: "/var/lib/services/storage"
      RATE_LIMITS: "${RATE_LIMITS:-burst=10,per_min=60}"
      LOG_LEVEL: "${STUDIO_LOG_LEVEL:-INFO}"
      ANIMICA_NETWORK: "mainnet"
      # Faucet disabled on mainnet by default
      FAUCET_KEY: ""
    volumes:
      - mainnet_services_data:/var/lib/services
    ports:
      - "${HOST_STUDIO_SERVICES:-8787}:8787"
    command: >
      bash -lc "
      set -euo pipefail;
      python -m studio_services.main --host 0.0.0.0 --port 8787
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      node:
        condition: service_healthy
    networks: [mainnet]
    restart: unless-stopped

  # ---------------------------------------------------------------
  # explorer-web (optional - use separate profile)
  # ---------------------------------------------------------------
  explorer:
    profiles: [studio]
    image: node:20-alpine
    container_name: animica-mainnet-explorer
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp
    environment:
      VITE_RPC_URL: "http://localhost:${HOST_RPC_PORT:-8545}"
      VITE_CHAIN_ID: "${ANIMICA_CHAIN_ID:-1}"
      VITE_SERVICES_URL: "http://localhost:${HOST_STUDIO_SERVICES:-8787}"
      ANIMICA_NETWORK: "mainnet"
    volumes:
      - ../../explorer-web:/app:rw
    ports:
      - "${HOST_EXPLORER:-5173}:5173"
    command: >
      sh -lc "
      set -eu;
      corepack enable || true;
      if ! command -v pnpm >/dev/null 2>&1; then npm i -g pnpm@9; fi;
      pnpm install --frozen-lockfile || pnpm install;
      pnpm run build;
      pnpm exec vite preview --host 0.0.0.0 --port 5173
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
    depends_on:
      node:
        condition: service_healthy
      services:
        condition: service_healthy
    networks: [mainnet]
    restart: unless-stopped
