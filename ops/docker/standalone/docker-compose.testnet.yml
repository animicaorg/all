# Animica testnet — STANDALONE variant. See standalone/docker-compose.mainnet.yml
# for the design notes. This file mirrors testnet ports + chain id.
name: animica-testnet

networks:
  animica:
    driver: bridge

volumes:
  node-data:
  node-config:

services:
  node:
    image: ${NODE_IMAGE:-animica-local/node:${ANIMICA_VERSION:-latest}}
    container_name: animica-testnet-node
    restart: unless-stopped
    environment:
      ANIMICA_NETWORK: "testnet"
      ANIMICA_CHAIN_ID: "2"
      ANIMICA_DATA_DIR: "/data"
      HOME: "/data"
      ANIMICA_HOME: "/data/chain-2"
      GENESIS_PATH: "/app/core/genesis/testnet.json"
      ANIMICA_GENESIS_PATH: "/app/core/genesis/testnet.json"
      ANIMICA_LOG_LEVEL: "${ANIMICA_LOG_LEVEL:-INFO}"
      ANIMICA_RPC_HOST: "0.0.0.0"
      ANIMICA_RPC_PORT: "18546"
      ANIMICA_RPC_CORS_ORIGINS: "${ANIMICA_RPC_CORS_ORIGINS:-[\"http://localhost:*\",\"http://127.0.0.1:*\"]}"
      # See mainnet compose for the reasoning behind TCP-only + no inbound
      # reachability enforcement. Operators with a public IP can opt back in.
      ANIMICA_P2P_ENABLE: "true"
      ANIMICA_P2P_CHAIN_ID: "2"
      ANIMICA_P2P_PORT: "31334"
      ANIMICA_P2P_LISTEN_TCP: "0.0.0.0:31334"
      ANIMICA_P2P_ENABLE_TCP: "true"
      ANIMICA_P2P_ENABLE_QUIC: "${ANIMICA_P2P_ENABLE_QUIC:-false}"
      ANIMICA_P2P_ENABLE_WS: "${ANIMICA_P2P_ENABLE_WS:-false}"
      ANIMICA_P2P_ENFORCE_INBOUND_REACHABILITY: "${ANIMICA_P2P_ENFORCE_INBOUND_REACHABILITY:-false}"
      ANIMICA_P2P_SEEDS: "${ANIMICA_P2P_SEEDS:-}"
      ANIMICA_P2P_ADVERTISE_ADDR: "${ANIMICA_P2P_ADVERTISE_ADDR:-}"
      ANIMICA_P2P_DATA_DIR: "/data/chain-2/p2p"
      ANIMICA_PEER_STORE_PATH: "/data/chain-2/p2p"
      ANIMICA_SNAPSHOT_DIR: "/data/snapshots"
      P2P_SEEDS: "${P2P_SEEDS:-}"
      SYNC_ENABLED: "${SYNC_ENABLED:-1}"
    volumes:
      - node-data:/data
      - node-config:/config
    ports:
      - "127.0.0.1:${HOST_RPC_PORT:-18546}:18546"
      - "${HOST_P2P_PORT:-31334}:31334"
      - "${HOST_METRICS_PORT:-19000}:19000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:18546/rpc
          -H 'content-type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"chain.getHead","params":{}}'
          >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [animica]

  miner:
    image: ${MINER_IMAGE:-animica-local/miner:${ANIMICA_VERSION:-latest}}
    container_name: animica-testnet-miner
    profiles: [miner]
    restart: unless-stopped
    depends_on:
      node:
        condition: service_healthy
    environment:
      RPC_URL: "http://node:18546"
      DEVICE: "${MINER_DEVICE:-cpu}"
      THREADS: "${MINER_THREADS:-4}"
      LOG_LEVEL: "${MINER_LOG_LEVEL:-INFO}"
      PAYOUT_ADDRESS: "${MINER_PAYOUT_ADDRESS:-}"
      AICF_WORKER: "${MINER_AICF_WORKER:-1}"
      ANIMICA_NETWORK: "testnet"
    networks: [animica]
