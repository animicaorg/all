# Prometheus configuration for multi-node Animica network
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    network: 'devnet'
    cluster: 'multinode'

# Scrape configurations for each node
scrape_configs:
  - job_name: 'node1'
    static_configs:
      - targets: ['node1:9000']
        labels:
          instance: 'node1'
          role: 'seed'
          node_type: 'full'

  - job_name: 'node2'
    static_configs:
      - targets: ['node2:9000']
        labels:
          instance: 'node2'
          role: 'peer'
          node_type: 'full'

  - job_name: 'node3'
    static_configs:
      - targets: ['node3:9000']
        labels:
          instance: 'node3'
          role: 'peer'
          node_type: 'full'
