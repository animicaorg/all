# Animica PQ Algorithm IDs (canonical)
# -------------------------------------------------------------
# These IDs are used everywhere a compact algorithm reference is
# needed (addresses, tx SignBytes headers, P2P HELLO, alg-policy
# Merkle tree leaves, RPC metadata).
#
# Conventions
# - 0x1*** : Signature schemes
# - 0x2*** : KEM schemes
# - Values are uint16 in CBOR/MsgPack surfaces.
# - Sizes are exact byte lengths for raw keys/signatures/ciphertexts.
# - "nist_level" follows NIST PQC categories (1, 3, 5).
#
# NOTE: Public addresses use payload = alg_id || sha3_256(pubkey),
# bech32m-encoded with network HRP (see spec/domains.yaml and pq/address.py).
#
version: 1
updated: 2025-09-19
registry:
  - id: 0x1001
    name: dilithium3
    display: "CRYSTALS-Dilithium3 (legacy stub)"
    kind: signature
    nist_level: 3
    status: deprecated
    deprecated_since: "0.2.0"
    sizes:
      pk: 1952
      sk: 4000
      sig: 3293
    hashing:
      address_hash: sha3_256
      domain_default: "animica:tx:signbytes:v1"
    notes:
      - "DEPRECATED. Implementation is a commitment-style stub: verify"
      - "just checks sig[:32] == SHAKE-256(pk[:32] || msg, 32), which"
      - "anyone with pk can produce. Historical blocks keep verifying"
      - "under this scheme so chain state stays intact, but new tx"
      - "submissions are rejected once the v2 transition window closes."
      - "New wallets MUST use ml_dsa_65 (0x1003)."

  - id: 0x1002
    name: sphincs_shake_128s
    display: "SPHINCS+ SHAKE-128s (legacy stub)"
    kind: signature
    nist_level: 1
    status: deprecated
    deprecated_since: "0.2.0"
    sizes:
      pk: 64
      sk: 64
      sig: 7856
    hashing:
      address_hash: sha3_256
      domain_default: "animica:tx:signbytes:v1"
    notes:
      - "DEPRECATED. Same forgery weakness as 0x1001 — fallback_sig_sign"
      - "uses sig = SHAKE-256('sig' || pk || msg). New wallets MUST use"
      - "ml_dsa_65 (0x1003); no pure-Python SPHINCS+ reference is shipped"
      - "yet, may return in a future package version."

  - id: 0x1003
    name: ml_dsa_65
    display: "ML-DSA-65 (FIPS 204)"
    kind: signature
    nist_level: 3
    status: active
    sizes:
      pk: 1952
      sk: 4032        # FIPS 204 expanded sk
      sig: 3309       # FIPS 204 max sig
    hashing:
      address_hash: sha3_256
      domain_default: "animica:tx:signbytes:v1"
    notes:
      - "Real ML-DSA-65 per FIPS 204. Vendored from jack4818/dilithium-py"
      - "(MIT) at python/animica/_vendor/dilithium_py_v2/."
      - "Default scheme for `animica wallet create` from package 0.2.0 on."
      - "coretx scheme_id = 11."

  - id: 0x2001
    name: kyber768
    display: "CRYSTALS-Kyber768"
    kind: kem
    nist_level: 3
    status: active
    sizes:
      pk: 1184        # bytes
      sk: 2400        # bytes
      ct: 1088        # ciphertext bytes
      ss: 32          # shared secret bytes
    handshake:
      kdf: hkdf_sha3_256
      aead: chacha20_poly1305 # or aes_gcm by policy/feature flag
      transcript_domain: "animica:p2p:handshake:v1"
    notes:
      - "Default KEM for P2P handshakes (AEAD keys via HKDF-SHA3-256)."

# Reserved ranges for future extensions
# 0x1003–0x10FF : other PQ signatures (Dilithium2/5, Falcon*, SPHINCS+ variants)
# 0x2002–0x20FF : other KEMs (Kyber1024, ML-KEM profiles)
# 0x3000–0x3FFF : hybrid or composite descriptors, if ever standardized

# Cross-checks (non-consensus metadata)
checks:
  bech32_hrp_examples:
    mainnet: anim
    testnet: tnim
    devnet: dnim
  address_payload_length: 2 + 32   # alg_id (u16) + sha3_256(pubkey)

