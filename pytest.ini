[pytest]
# Pytest configuration for Animica blockchain

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Ignore patterns - exclude virtual env, build artifacts, and node_modules
norecursedirs = .venv .git __pycache__ node_modules dist build *.egg-info native/target sdk/python/tests python/animica/cli/tests vm_py/tests

# Test paths to collect from
testpaths = 
    aicf/tests
    consensus/tests
    core/tests
    execution/tests
    mempool/tests
    mining/tests
    p2p/tests
    rpc/tests
    python/animica
    sdk/python/tests
    contracts/tests
    vm_py/tests

# Output options
addopts = 
    --strict-markers
    --tb=short
    -ra
    --color=yes

# Markers
markers =
    asyncio: mark test as requiring asyncio event loop
    integration: mark test as integration test (may be slow)
    slow: mark test as slow-running
    unit: mark test as unit test (fast, isolated)
