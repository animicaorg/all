# Animica CEX - Secure Nginx Configuration
# Production-ready security configuration for financial exchange platform

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/m;

# Connection limits per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Bad bot detection - block common attack patterns
map $http_user_agent $bad_bot {
    default 0;
    ~*(nmap|nikto|wikto|sf|sqlmap|bsqlbf|w3af|acunetix|havij|appscan) 1;
    ~*(libwww|python|perl|curl|wget|bash|sh|scrapy|zgrab) 1;
    "" 1;
}

# Block suspicious request methods
map $request_method $bad_method {
    default 0;
    ~*(TRACE|TRACK|DEBUG|OPTIONS) 1;
}

# Upstream definitions
upstream exchange_api {
    least_conn;
    server exchange-api:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream admin_api {
    least_conn;
    server admin-api:8001 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream admin_web {
    least_conn;
    server admin-web:3000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# HTTP redirect to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    # Allow ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main Exchange API - Public Trading Interface
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.exchange.local;
    
    # SSL/TLS Configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    
    # Remove server tokens
    server_tokens off;
    more_clear_headers Server;
    
    # Request size limits
    client_max_body_size 1m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
    
    # Connection limits
    limit_conn conn_limit 50;
    
    # Block bad bots and methods
    if ($bad_bot) {
        return 403;
    }
    if ($bad_method) {
        return 405;
    }
    
    # Access and error logs
    access_log /var/log/nginx/exchange_api_access.log;
    error_log /var/log/nginx/exchange_api_error.log warn;
    
    # Login endpoints - strict rate limiting
    location ~ ^/api/v1/(auth/login|auth/register|auth/password-reset) {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        
        proxy_pass http://exchange_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }
    
    # WebSocket endpoints - moderate rate limiting
    location /ws {
        limit_req zone=ws_limit burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://exchange_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
    
    # Trading endpoints - moderate rate limiting
    location ~ ^/api/v1/(orders|trades|positions) {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        
        proxy_pass http://exchange_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_buffering off;
    }
    
    # General API endpoints
    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;
        limit_req_status 429;
        
        proxy_pass http://exchange_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }
    
    # Health check - no rate limiting
    location /health {
        access_log off;
        proxy_pass http://exchange_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Admin API - Internal Management Interface
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin-api.exchange.local;
    
    # SSL/TLS Configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
