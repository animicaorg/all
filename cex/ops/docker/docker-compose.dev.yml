      <<: *health-defaults
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3600/health"]

  risk-service:
    <<: *node-base
    env_file:
      - ./env/.env
    environment:
      SERVICE_NAME: risk-service
      PORT: ${RISK_SERVICE_PORT:-3700}
      NODE_ENV: development
    command: sh -c "corepack enable && pnpm install && pnpm --filter @cex/risk-service dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3700/health"]

  admin-service:
    <<: *node-base
    env_file:
      - ./env/.env
    environment:
      SERVICE_NAME: admin-service
      PORT: ${ADMIN_SERVICE_PORT:-3001}
