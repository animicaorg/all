        condition: service_healthy
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3500/health"]

  animica-asset-service:
    <<: *node-base
    env_file:
      - ./env/.env
    environment:
      SERVICE_NAME: animica-asset-service
      PORT: ${ANIMICA_ASSET_PORT:-3600}
