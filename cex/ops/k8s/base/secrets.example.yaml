# Example Secrets - DO NOT commit real values
# Create secrets using kubectl create secret or external secrets operator
#
# kubectl create secret generic cex-secrets \
#   --from-literal=db-password='your-secure-password' \
#   --from-literal=redis-password='your-redis-password' \
#   --from-literal=jwt-secret='your-jwt-secret' \
#   --namespace=cex-prod

apiVersion: v1
kind: Secret
metadata:
  name: cex-secrets
  namespace: cex-prod
type: Opaque
stringData:
  # Database
  db-password: "REPLACE_WITH_SECURE_PASSWORD"
  db-user: "cex_prod"
  
  # Redis
  redis-password: "REPLACE_WITH_SECURE_PASSWORD"
  
  # JWT
  jwt-secret: "REPLACE_WITH_SECURE_JWT_SECRET"
  session-secret: "REPLACE_WITH_SECURE_SESSION_SECRET"
  
  # BitGo
  bitgo-access-token: "REPLACE_WITH_BITGO_TOKEN"
  bitgo-webhook-secret: "REPLACE_WITH_WEBHOOK_SECRET"
  
  # Admin API
  admin-api-key: "REPLACE_WITH_ADMIN_API_KEY"
  
  # SMTP
  smtp-user: "REPLACE_WITH_SMTP_USER"
  smtp-password: "REPLACE_WITH_SMTP_PASSWORD"
  
  # S3
  s3-access-key: "REPLACE_WITH_S3_ACCESS_KEY"
  s3-secret-key: "REPLACE_WITH_S3_SECRET_KEY"
