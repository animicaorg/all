apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: cex-prod
spec:
  schedule: "0 2 * * *"  # 2 AM daily
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
          containers:
          - name: backup
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - |
              set -e
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="/backups/postgres_backup_${TIMESTAMP}.sql.gz"
              
              echo "Starting backup at ${TIMESTAMP}"
              pg_dump -h postgres -U ${POSTGRES_USER} ${POSTGRES_DB} | gzip > ${BACKUP_FILE}
              
              echo "Backup completed: ${BACKUP_FILE}"
              ls -lh ${BACKUP_FILE}
              
              # Upload to S3 if AWS CLI is available
              if command -v aws >/dev/null 2>&1; then
                echo "Uploading to S3..."
                aws s3 cp ${BACKUP_FILE} s3://${S3_BUCKET}/postgres/
              fi
              
              # Cleanup old backups (keep last 30 days)
              find /backups -name "postgres_backup_*.sql.gz" -mtime +30 -delete
            env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cex-secrets
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cex-secrets
                  key: db-password
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cex-config
                  key: DB_NAME
            - name: S3_BUCKET
              value: "animica-cex-prod-backups"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cex-secrets
                  key: s3-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cex-secrets
                  key: s3-secret-key
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: cex-prod
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
